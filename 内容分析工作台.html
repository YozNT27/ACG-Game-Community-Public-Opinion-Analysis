    const parts = [];
    parts.push(t(16, top + ph / 2, "占比", 11, "#666", "middle", "normal", -90));
    const showPct = slot >= 40;
    groups.forEach((g, i) => {
      const cx = left + slot * (i + 0.5);
      let y = top + ph;
      for (const [sname, col, vals, eid] of series) {
        const val = vals[i] || 0;
        const bh = ph * val / 100;
        y -= bh;
        parts.push(markRect(cx - bw / 2, y, bw, Math.max(bh, 0), col, `${g} · ${sname}：${fmtNum(val, true)}`, {
          minH: val > 0 ? 3 : 0,
          slice: eid ? { kind: "emo", id: eid, group: g } : undefined,
        }));
        if (showPct && val >= 18) parts.push(t(cx, y + bh / 2 + 4, `${val.toFixed(0)}%`, 10, "#fff", "middle"));
      }
      const gLab = clipLabel(g, rotate ? 8 : Math.max(3, Math.floor(slot / 13)));
      if (rotate) parts.push(t(cx + 2, top + ph + 10, gLab, 10, "#333", "end", "normal", -50));
      else parts.push(t(cx, top + ph + 18, gLab, 12, "#333", "middle"));
    });
    parts.push(...legend(legendItems, left, h - legH + 8, 86, w - 16));
    return wrap(w, h, parts.join(""));
  }

  function donut(title, pairs, w, h) {
    w = w || 760; h = h || 460;
    pairs = pairs.filter((p) => p[1] > 0);
    const total = pairs.reduce((n, p) => n + p[1], 0);
    if (total <= 0) return wrap(w, h, t(w / 2, h / 2, "暂无数据", 14, "#999", "middle"));
    const cx = w / 2, cy = 200, r = 124, ri = 70;
    const parts = [];
    let ang = -Math.PI / 2;
    const xy = (a, rad) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
    for (const [name, val, col, eid] of pairs) {
      const frac = val / total;
      const tip = `${name}：${fmtNum(val, false)}（${fmtNum(100 * frac, true)}）`;
      const slice = eid ? ` data-slice="${esc(JSON.stringify({ kind: "emo", id: eid }))}"` : "";
      if (frac >= 0.999) {
        parts.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="${col}"${tipAttr(tip)}${slice}/>`);
        parts.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${ri}" fill="#fff" pointer-events="none"/>`);
        continue;
      }
      const sweep = 2 * Math.PI * frac;
      const a1 = ang + sweep;
      const large = sweep > Math.PI ? 1 : 0;
      const [x0, y0] = xy(ang, r), [x1, y1] = xy(a1, r);
      const [xi0, yi0] = xy(ang, ri), [xi1, yi1] = xy(a1, ri);
      parts.push(`<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L ${xi1.toFixed(1)} ${yi1.toFixed(1)} A ${ri} ${ri} 0 ${large} 0 ${xi0.toFixed(1)} ${yi0.toFixed(1)} Z" fill="${col}"${tipAttr(tip)}${slice}/>`);
      ang = a1;
    }
    parts.push(t(cx, cy + 5, String(Math.round(total)), 18, "#222", "middle", "bold"));
    parts.push(t(cx, cy + 22, "可编码", 11, "#888", "middle"));
    const legendItems = pairs.map(([name, val, col]) => [`${name} ${val.toFixed(0)}`, col]);
    const legH = legendHeight(legendItems, w - 32, 110);
    h = Math.max(h, cy + r + 28 + legH);
    parts.push(...legend(legendItems, 24, h - legH + 8, 110, w - 16));
    return wrap(w, h, parts.join(""));
  }

  function hist(title, values, h) {
    h = h || 260;
    if (!values.length) return wrap(360, h, t(180, h / 2, "暂无数据", 14, "#999", "middle"));
    let lo = Math.min(...values), hi = Math.max(...values);
    if (hi === lo) hi = lo + 1;
    const bins = 12;
    const width = (hi - lo) / bins;
    const counts = Array(bins).fill(0);
    for (const v of values) counts[Math.min(Math.floor((v - lo) / width), bins - 1)] += 1;
    const pairs = counts.map((c, i) => {
      const a = lo + width * i;
      const b = lo + width * (i + 1);
      const lab = a.toFixed(1);
      return [lab, c, `点赞对数 ${a.toFixed(2)}～${b.toFixed(2)}：${c} 条`];
    });
    return bars(title, pairs, { h: Math.max(h, 360), ylab: "条数", xlab: "点赞（对数，左低右高）", color_mode: "mono", show_legend: false });
  }

  function quantile(s, q) {
    const n = s.length;
    const pos = (n - 1) * q;
    const lo = Math.floor(pos), hi = Math.ceil(pos);
    if (lo === hi) return s[lo];
    return s[lo] * (hi - pos) + s[hi] * (pos - lo);
  }

  function boxplot(title, groups, ylab) {
    const allv = groups.flatMap((g) => g[1]);
    if (!allv.length) return wrap(480, 360, t(240, 180, "暂无数据", 14, "#999", "middle"));
    const n = Math.max(groups.length, 1);
    const w = fitWidth(n, n <= 2 ? 160 : 110, 72, 28, 720, 1040);
    const left = 72, right = 24, top = 18;
    const rotate = n >= 5;
    const legendItems = groups.filter((g) => g[1].length).map((g) => [g[0], g[2]]);
    const legH = n >= 2 ? legendHeight(legendItems, w - left - 16, 96) : 0;
    const bottom = (rotate ? 100 : 52) + legH;
    const h = Math.max(380, top + 260 + bottom);
    const pw = w - left - right, ph = h - top - bottom;
    let ymin = Math.min(...allv), ymax = Math.max(...allv);
    const pad = (ymax - ymin) * 0.1 || 0.5;
    ymin -= pad; ymax += pad;
    const parts = [];
    parts.push(t(16, top + ph / 2, ylab || "ln(点赞+1)", 11, "#666", "middle", "normal", -90));
    const ymap = (v) => top + ph * (1 - (v - ymin) / (ymax - ymin));
    for (let i = 0; i < 5; i++) {
      const val = ymin + (ymax - ymin) * i / 4;
      const y = ymap(val);
      parts.push(`<line x1="${left}" y1="${y.toFixed(1)}" x2="${w - right}" y2="${y.toFixed(1)}" stroke="#eee"/>`);
      parts.push(t(left - 8, y + 4, val.toFixed(1), 10, "#888", "end"));
    }
    const slot = pw / n;
    const bw = Math.min(n <= 2 ? 72 : 52, slot * 0.42);
    const showIx = new Set(labelIndices(n, slot, rotate));
    groups.forEach(([name, vs, col], i) => {
      if (!vs.length) return;
      const s = vs.slice().sort((a, b) => a - b);
      const q1 = quantile(s, 0.25), med = quantile(s, 0.5), q3 = quantile(s, 0.75);
      const iqr = q3 - q1;
      const loF = q1 - 1.5 * iqr, hiF = q3 + 1.5 * iqr;
      const above = s.filter((v) => v >= loF);
      const below = s.filter((v) => v <= hiF);
      const whiskLo = above.length ? Math.min(...above) : s[0];
      const whiskHi = below.length ? Math.max(...below) : s[s.length - 1];
      const cx = left + slot * (i + 0.5);
      const y1 = ymap(q1), y2 = ymap(q3), ym = ymap(med);
      const yl = ymap(whiskLo), yh = ymap(whiskHi);
      const tip = `${name}：n=${s.length}；中位数 ${med.toFixed(2)}；四分位 ${q1.toFixed(2)}～${q3.toFixed(2)}；须 ${whiskLo.toFixed(2)}～${whiskHi.toFixed(2)}`;
      parts.push(`<line x1="${cx}" y1="${yl.toFixed(1)}" x2="${cx}" y2="${yh.toFixed(1)}" stroke="${col}" pointer-events="none"/>`);
      parts.push(markRect(cx - bw / 2, Math.min(y1, y2), bw, Math.max(Math.abs(y1 - y2), 1), col, tip, { minH: 12, fillOpacity: 0.35, stroke: col }));
      parts.push(`<line x1="${(cx - bw / 2).toFixed(1)}" y1="${ym.toFixed(1)}" x2="${(cx + bw / 2).toFixed(1)}" y2="${ym.toFixed(1)}" stroke="#222" stroke-width="1.6" pointer-events="none"/>`);
      if (!showIx.has(i)) return;
      const label = clipLabel(name, rotate ? 8 : Math.max(3, Math.floor(slot / 13)));
      if (rotate) parts.push(t(cx + 2, top + ph + 10, label, 10, "#333", "end", "normal", -50));
      else parts.push(t(cx, top + ph + 18, label, 11, "#333", "middle"));
    });
    if (n >= 2) parts.push(...legend(legendItems, left, h - legH + 8, 96, w - 16));
    return wrap(w, h, parts.join(""));
  }

  function sourceStats(rows) {
    const dates = rows.map((r) => r.comment_date || "").filter((d) => d && d !== "未知");
    const gcount = countBy(rows, "group");
    if (!Object.keys(gcount).length && rows.length) gcount["未分组"] = rows.length;
    const fixed = {};
    for (const r of rows) {
      const g = r.group || "未分组";
      fixed[g] = (fixed[g] || 0) + 1;
    }
    const sources = new Set(rows.map((r) => (r.source_title || r.source_id || "").trim()).filter(Boolean));
    const names = mostCommon(fixed).map((x) => x[0]);
    return {
      n: rows.length,
      groups: names.length,
      group_names: names,
      layout: names.length <= 1 ? "single" : "multi",
      sources: sources.size,
      date_min: dates.length ? dates.reduce((a, b) => (a < b ? a : b)) : "",
      date_max: dates.length ? dates.reduce((a, b) => (a > b ? a : b)) : "",
    };
  }

  function sourceCharts(rows) {
    const groups = {};
    for (const r of rows) {
      const g = r.group || "未分组";
      groups[g] = (groups[g] || 0) + 1;
    }
    const gPairs = mostCommon(groups);
    const dates = {};
    for (const r of rows) {
      const d = r.comment_date || "未知";
      dates[d] = (dates[d] || 0) + 1;
    }
    const known = Object.entries(dates).filter(([d]) => d && d !== "未知").sort((a, b) => a[0].localeCompare(b[0]));
    const unk = dates["未知"] || 0;
    const datePairs = known.concat(unk ? [["未知", unk]] : []);
    const dateFmt = datePairs.map(([a, b]) => [a.length >= 10 ? a.slice(5) : a, b]);
    const likes = [];
    for (const r of rows) {
      const n = Number(r.like_count);
      if (!Number.isNaN(n)) likes.push(Math.log1p(n));
    }
    const strata = {};
    for (const r of rows) {
      const s = r.stratum || "未分层";
      strata[s] = (strata[s] || 0) + 1;
    }
    const sources = {};
    for (const r of rows) {
      const s = (r.source_title || r.source_id || "未标来源").trim() || "未标来源";
      sources[s] = (sources[s] || 0) + 1;
    }
    const cmap = colorsFor(gPairs.map((x) => x[0]));
    const byGS = {};
    for (const r of rows) {
      const g = r.group || "未分组";
      const s = r.stratum || "未分层";
      if (!byGS[g]) byGS[g] = {};
      byGS[g][s] = (byGS[g][s] || 0) + 1;
    }
    const gnames = gPairs.slice(0, 8).map((x) => x[0]);
    const stratumKeys = [...new Set(Object.values(byGS).flatMap((c) => Object.keys(c)))].sort(
      (a, b) => stratumLabel(a).localeCompare(stratumLabel(b), "zh") || a.localeCompare(b)
    );
    const series = [];
    for (const st of stratumKeys.slice(0, 6)) {
      const vals = gnames.map((g) => {
        const tot = Object.values(byGS[g] || {}).reduce((n, x) => n + x, 0) || 1;
        return 100 * ((byGS[g] || {})[st] || 0) / tot;
      });
      series.push([stratumLabel(st), stratumColor(st), vals]);
    }
    const stratumPairs = mostCommon(strata).map(([a, b]) => [stratumLabel(a), b]);
    const multi = gPairs.length >= 2;
    const nDates = dateFmt.length;
    const dateW = fitWidth(nDates, nDates > 18 ? 36 : 56, 72, 32, 760, 1040);
    const out = [];
    if (multi) {
      out.push({
        id: "g", section: "mix", wide: false, title: "各分组有多少条",
        caption: "柱色按导入时的分组自动分配，底栏色块为图例。",
        svg: bars("各分组有多少条", gPairs.map(([a, b]) => [a, b]), { color_mode: "group", show_legend: true, ylab: "条数", colors: cmap }),
      });
    } else {
      const gname = gPairs[0] ? gPairs[0][0] : "未分组";
      const n0 = gPairs[0] ? gPairs[0][1] : 0;
      out.push({
        id: "g", section: "mix", wide: false, title: "导入了多少条",
        caption: `当前只有「${gname}」一组，共 ${n0} 条。`,
        svg: bars("导入了多少条", [[gname, n0]], { color_mode: "group", show_legend: false, ylab: "条数", colors: cmap }),
      });
    }
    out.push({
      id: "s", section: "mix", wide: false, title: "热门和最新",
      caption: "蓝色表示热门，橙色表示最新。",
      svg: bars("热门和最新", stratumPairs, { color_mode: "stratum", show_legend: true, ylab: "条数" }),
    });
    if (multi && gnames.length && series.length) {
      out.push({
        id: "gs", section: "mix", wide: gnames.length >= 3,
        title: "各组内部：热门和最新各占多少",
        caption: "配色与「热门和最新」一致：蓝为热门，橙为最新。柱内数字为该组内部占比。",
        svg: stacked("各组内部构成", gnames, series),
      });
    }
    out.push({
      id: "d", section: "time", wide: nDates > 8, scroll: nDates > 16,
      title: "每天有多少条",
      caption: "各日期均使用同一颜色。日期较多时可左右滑动查看；将鼠标移至柱上可查看当天条数。",
      svg: bars("每天有多少条", dateFmt, { w: dateW, h: 360, color_mode: "mono", show_legend: false, ylab: "条数", xlab: "评论日期" }),
    });
    const nSrc = Math.min(12, Object.keys(sources).length);
    out.push({
      id: "src", section: "src", wide: true, title: "评论最多的来源",
      caption: "来源名称较长时可左右滑动查看全称。",
      svg: hbars("评论最多的来源", mostCommon(sources).slice(0, 12).map(([a, b]) => [a, b]), 880, Math.max(200, 56 + nSrc * 30)),
    });
    out.push({
      id: "l", section: "like", wide: false, title: "点赞高低",
      caption: "横轴为 ln(点赞+1)；越靠右表示点赞越高。",
      svg: hist("点赞高低（对数）", likes, 300),
    });
    if (multi) {
      const likeGroups = [];
      for (const [g] of gPairs.slice(0, 6)) {
        const vs = [];
        for (const r of rows) {
          if ((r.group || "未分组") !== g) continue;
          const n = Number(r.like_count);
          if (!Number.isNaN(n)) vs.push(Math.log1p(n));
        }
        if (vs.length) likeGroups.push([g, vs, cmap[g] || PALETTE[0]]);
      }
      if (likeGroups.length) {
        out.push({
          id: "box", section: "like", wide: likeGroups.length >= 3,
          title: "各组点赞对比",
          caption: "配色与分组图一致。箱体位置越高，表示该组高赞评论越多。",
          svg: boxplot("各组点赞（对数）", likeGroups, "ln(点赞+1)"),
        });
      }
    }
    return out;
  }

  function cellDenom(denom, g, tid) {
    const d = denom[g];
    if (d && typeof d === "object") return Number(d[tid]) || 0;
    return Number(d) || 0;
  }

  function themeGrouped(groups, counts, denom, themes, tlabel, cmap, opt) {
    opt = opt || {};
    const themeIds = themes.map((th) => th.id);
    const n = Math.max(themeIds.length, 1);
    const nG = Math.max(groups.length, 1);
    const w = fitWidth(n, Math.max(64, 24 * nG + 32), 72, 24, 760, 1040);
    const perTheme = groups.some((g) => denom[g] && typeof denom[g] === "object");
    const legendItems = groups.map((g, j) => {
      const d = denom[g];
      const nLab = !perTheme && d != null ? ` ${d}条` : "";
      return [`${g}${nLab}`, colorOf(g, j, cmap)];
    });
    const left = 72, right = 24, top = 18;
    const rotate = n >= 5 || w / n < 90;
    const legH = legendHeight(legendItems, w - left - 16, 120);
    const bottom = (rotate ? 108 : 56) + legH;
    const h = Math.max(400, top + 260 + bottom);
    const pw = w - left - right, ph = h - top - bottom;
    const slot = pw / n;
    const bw = Math.min(22, Math.max(7, slot * 0.72 / nG));
    const ymax = 100;
    const showIx = new Set(labelIndices(n, slot, rotate));
    const parts = [];
    parts.push(t(16, top + ph / 2, opt.ylab || "提及率（%）", 11, "#666", "middle", "normal", -90));
    for (let tick = 0; tick <= 100; tick += 20) {
      const y = top + ph * (1 - tick / ymax);
      parts.push(`<line x1="${left}" y1="${y.toFixed(1)}" x2="${w - right}" y2="${y.toFixed(1)}" stroke="#eee"/>`);
      parts.push(t(left - 8, y + 4, String(tick), 10, "#888", "end"));
    }
    themeIds.forEach((tid, i) => {
      const cx = left + slot * (i + 0.5);
      groups.forEach((g, j) => {
        const nHit = (counts[g] && counts[g][tid]) || 0;
        const d = cellDenom(denom, g, tid);
        const val = d ? 100 * nHit / d : 0;
        const bh = ph * val / ymax;
        const x = cx - nG * bw / 2 + j * bw;
        const lab0 = tlabel[tid] || tid;
        parts.push(markRect(x, top + ph - bh, Math.max(bw - 1, 2), bh, colorOf(g, j, cmap), `${g} · ${lab0}：${fmtNum(val, true)}（${nHit}/${d}）`, {
          minH: val > 0 ? 6 : 0,
          slice: { kind: "theme", id: tid, group: g },
        }));
      });
      if (!showIx.has(i)) return;
      const lab = clipLabel(tlabel[tid] || tid, rotate ? 8 : Math.max(2, Math.floor(slot / 13)));
      if (rotate) parts.push(t(cx + 2, top + ph + 10, lab, 10, "#333", "end", "normal", -50));
      else parts.push(t(cx, top + ph + 18, lab, 11, "#333", "middle"));
    });
    parts.push(...legend(legendItems, left, h - legH + 8, 120, w - 16));
    return wrap(w, h, parts.join(""));
  }

  function codingCharts(sample, coding, book) {
    const themes = book.themes || [];
    const tlabel = {};
    themes.forEach((t) => { tlabel[t.id] = t.label; });
    const groups = [];
    for (const r of sample) {
      const g = r.group || "未分组";
      if (!groups.includes(g)) groups.push(g);
    }
    const coded = [];
    for (const r of sample) {
      const c = coding[r.comment_id];
      if (c && !c.skipped) coded.push([r, c]);
    }
    if (!coded.length) return [];
    const cmap = colorsFor(groups);
    const multi = groups.length >= 2;
    const codable = coded.filter(([, c]) => !c.uncodable);
    const denom = {};
    groups.forEach((g) => {
      denom[g] = Math.max(codable.filter(([r]) => (r.group || "未分组") === g).length, 1);
    });
    const counts = {};
    groups.forEach((g) => { counts[g] = {}; });
    for (const [r, c] of codable) {
      const g = r.group || "未分组";
      for (const th of c.themes || []) counts[g][th.id] = (counts[g][th.id] || 0) + 1;
    }
    const themeIds = themes.map((t) => t.id);
    let themeSvg;
    if (!multi) {
      const g = groups[0] || "未分组";
      const themePairs = themeIds.map((tid) => {
        const nHit = counts[g][tid] || 0;
        const pct = 100 * nHit / (denom[g] || 1);
        const lab = tlabel[tid] || tid;
        return [lab, pct, `${lab}：${fmtNum(pct, true)}（${nHit}/${denom[g] || 0}）`, { kind: "theme", id: tid, group: g }];
      });
      themeSvg = bars(`主题提及率 · ${g}（${denom[g] || 0}条）`, themePairs, {
        ylab: "提及率（%）", pct: true, y_max: 100, color_mode: "mono", show_legend: false,
      });
    } else {
      themeSvg = themeGrouped(groups, counts, denom, themes, tlabel, cmap);
    }
    const order = ["pos", "neu", "neg", "mix"];
    const series = order.map((eid) => {
      const vals = groups.map((g) => {
        const sub = codable.filter(([r]) => (r.group || "未分组") === g).map((x) => x[1]);
        const d = Math.max(sub.length, 1);
        return 100 * sub.filter((c) => c.overall_emotion === eid).length / d;
      });
      return [EMO_LABEL[eid], EMO_COLOR[eid], vals, eid];
    });
    const emoSvg = stacked("整句情绪构成", groups, series);
    const byStratum = new Map();
    for (const [r, c] of coded) {
      const g = r.group || "未分组";
      const st = stratumNorm(r.stratum);
      const key = g + "\0" + st;
      if (!byStratum.has(key)) byStratum.set(key, []);
      byStratum.get(key).push(c);
    }
    const hotNew = [];
    for (const [key, sub] of [...byStratum.entries()].sort((a, b) => a[0].localeCompare(b[0], "zh"))) {
      const [g, st] = key.split("\0");
      const lab = stratumLabel(st);
      const rate = 100 * sub.filter((c) => c.uncodable).length / sub.length;
      const label = multi ? `${g} · ${lab}` : lab;
      hotNew.push([label, rate, cmap[g] || PALETTE[0], { kind: "unc", group: g, stratum: st }]);
    }
    const uncSvg = hotNew.length ? bars("无法编码占比", hotNew.map((x) => [x[0], x[1], `${x[0]}：${fmtNum(x[1], true)}`, x[3]]), {
      h: 280, pct: true, y_max: 100, ylab: "占比（%）",
      colors: Object.fromEntries(hotNew.map((x) => [x[0], x[2]])),
      show_legend: hotNew.length >= 2,
    }) : "";
    const likeEmo = [];
    for (const eid of order) {
      const vs = [];
      for (const [r, c] of codable) {
        if (c.overall_emotion !== eid) continue;
        const n = Number(r.like_count);
        if (!Number.isNaN(n)) vs.push(Math.log1p(n));
      }
      if (vs.length) likeEmo.push([EMO_LABEL[eid], vs, EMO_COLOR[eid]]);
    }
    const boxSvg = likeEmo.length ? boxplot("不同情绪的点赞（对数）", likeEmo) : "";
    let gbox = "";
    if (multi) {
      const likeG = [];
      groups.forEach((g, i) => {
        const vs = [];
        for (const [r] of coded) {
          if ((r.group || "未分组") !== g) continue;
          const n = Number(r.like_count);
          if (!Number.isNaN(n)) vs.push(Math.log1p(n));
        }
        if (vs.length) likeG.push([g, vs, colorOf(g, i, cmap)]);
      });
      if (likeG.length) gbox = boxplot("样本点赞（对数）", likeG);
    }
    const emoCounts = {};
    for (const [, c] of codable) {
      const k = c.overall_emotion || "na";
      emoCounts[k] = (emoCounts[k] || 0) + 1;
    }
    const donutSvg = donut("可编码评论的情绪", Object.entries(emoCounts).map(([k, v]) => [EMO_LABEL[k] || k, v, EMO_COLOR[k] || "#aaa", k]));

    const negByG = {};
    const nCodableG = {};
    groups.forEach((g) => { negByG[g] = []; nCodableG[g] = 0; });
    for (const [r, c] of codable) {
      const g = r.group || "未分组";
      nCodableG[g] += 1;
      if (c.overall_emotion === "neg") negByG[g].push([r, c]);
    }
    const negRatePairs = groups.map((g) => {
      const d = nCodableG[g] || 0;
      const n = negByG[g].length;
      const pct = d ? 100 * n / d : 0;
      return [g, pct, `${g}：整句情绪为负面 ${n} / ${d}（${fmtNum(pct, true)}）`, { kind: "emo", id: "neg", group: g }];
    });
    const negColors = {};
    groups.forEach((g, i) => { negColors[g] = colorOf(g, i, cmap); });
    const negRateSvg = groups.length ? bars("各分组负面评论占比", negRatePairs, {
      pct: true, y_max: 100, ylab: "负面占比（%）",
      color_mode: "group", colors: negColors, show_legend: groups.length >= 6,
    }) : "";
    const gNeg = groups.filter((g) => negByG[g].length > 0);
    let negThemeSvg = "";
    if (gNeg.length === 1) {
      const g = gNeg[0];
      const d = negByG[g].length;
      const hit = {};
      for (const [, c] of negByG[g]) {
        for (const th of c.themes || []) hit[th.id] = (hit[th.id] || 0) + 1;
      }
      const pairs = themes.map((th) => {
        const nHit = hit[th.id] || 0;
        const pct = d ? 100 * nHit / d : 0;
        const lab = tlabel[th.id] || th.id;
        return [lab, pct, `${lab}：${fmtNum(pct, true)}（${nHit}/${d}）`, { kind: "theme", id: th.id, group: g }];
      });
      const themeCols = {};
      pairs.forEach(([lab]) => { themeCols[lab] = NEG; });
      negThemeSvg = bars(`负面评论的主题构成 · ${g}`, pairs, {
        pct: true, y_max: 100, ylab: "提及率（%）", color_mode: "group", colors: themeCols, show_legend: false,
      });
    } else if (gNeg.length > 1) {
      const nDenom = {};
      const nCounts = {};
      gNeg.forEach((g) => { nDenom[g] = negByG[g].length; nCounts[g] = {}; });
      for (const g of gNeg) {
        for (const [, c] of negByG[g]) {
          for (const th of c.themes || []) nCounts[g][th.id] = (nCounts[g][th.id] || 0) + 1;
        }
      }
      negThemeSvg = themeGrouped(gNeg, nCounts, nDenom, themes, tlabel, cmap, { ylab: "提及率（%）" });
    }
    const mentionD = {};
    const mentionNeg = {};
    groups.forEach((g) => { mentionD[g] = {}; mentionNeg[g] = {}; });
    let hasThemeNeg = false;
    for (const [r, c] of codable) {
      const g = r.group || "未分组";
      for (const th of c.themes || []) {
        if (!th || !th.id) continue;
        mentionD[g][th.id] = (mentionD[g][th.id] || 0) + 1;
        if (th.emotion === "neg") {
          mentionNeg[g][th.id] = (mentionNeg[g][th.id] || 0) + 1;
          hasThemeNeg = true;
        }
      }
    }
    let negAspectSvg = "";
    if (hasThemeNeg && themes.length) {
      if (groups.length === 1) {
        const g = groups[0];
        const pairs = themes.map((th) => {
          const d = mentionD[g][th.id] || 0;
          const nHit = mentionNeg[g][th.id] || 0;
          const pct = d ? 100 * nHit / d : 0;
          const lab = tlabel[th.id] || th.id;
          return [lab, pct, `${lab}：主题情绪为负面 ${nHit} / ${d}（${fmtNum(pct, true)}）`, { kind: "theme", id: th.id, group: g }];
        });
        const themeCols = {};
        pairs.forEach(([lab]) => { themeCols[lab] = NEG; });
        negAspectSvg = bars("各主题的负面标注占比", pairs, {
          pct: true, y_max: 100, ylab: "负面占比（%）", color_mode: "group", colors: themeCols, show_legend: false,
        });
      } else {
        negAspectSvg = themeGrouped(groups, mentionNeg, mentionD, themes, tlabel, cmap, { ylab: "负面占比（%）" });
      }
    }

    const out = [
      { id: "theme", title: "主题提及率", caption: "纵轴为该主题在各组可编码评论中的提及率。将鼠标移至柱上可查看具体数值。", svg: themeSvg, wide: true },
      { id: "emo", title: "整句情绪构成", caption: "各组可编码评论中，整句情绪为正、中、负、混的占比，合计为 100%。", svg: emoSvg, wide: true },
      { id: "donut", title: "可编码评论的整句情绪", caption: "全部可编码评论的整句情绪合计，不按分组拆分。圆心数字为可编码条数。", svg: donutSvg, wide: true },
    ];
    if (negRateSvg) {
      out.push({
        id: "negrate",
        title: "各分组负面评论占比",
        caption: "分母为该组可编码评论。分子为整句情绪标为「负面」的条数。混合情绪不计入本图。",
        svg: negRateSvg,
        wide: true,
      });
    }
    if (negThemeSvg) {
      out.push({
        id: "negtheme",
        title: "负面评论的主题构成",
        caption: "分母为该组整句情绪为「负面」的可编码评论。一条负面评论可同时计入多个主题，故合计可超过 100%。",
        svg: negThemeSvg,
        wide: true,
      });
    }
    if (negAspectSvg) {
      out.push({
        id: "negaspect",
        title: "各主题的负面标注占比",
        caption: "分母为该组可编码评论中提及该主题的条数。分子为该主题情绪被标为「负面」的条数。本图反映谈及某主题时的态度，而非负面评论在讨论哪些主题。",
        svg: negAspectSvg,
        wide: true,
      });
    }
    if (uncSvg) out.push({ id: "unc", title: "无法编码占比", caption: "无法编码评论占该组、该层已标注评论的比例。", svg: uncSvg, wide: true });
    if (boxSvg) out.push({ id: "ebox", title: "不同情绪的点赞", caption: "纵轴为点赞数的对数变换 ln(点赞+1)。箱体位置越高，表示该情绪下高赞评论越多。", svg: boxSvg, wide: true });
    if (gbox) out.push({ id: "gbox", title: "各组点赞对比", caption: "各组已标注评论的点赞分布。纵轴为 ln(点赞+1)。", svg: gbox, wide: true });
    return out;
  }

  function themeTable(sample, coding, book) {
    const themes = book.themes || [];
    const groups = [];
    for (const r of sample) {
      const g = r.group || "未分组";
      if (!groups.includes(g)) groups.push(g);
    }
    const codable = [];
    for (const r of sample) {
      const c = coding[r.comment_id];
      if (c && !c.skipped && !c.uncodable) codable.push([r, c]);
    }
    if (!codable.length) return "<p class='empty'>尚无可编码评论，无法计算主题提及率。</p>";
    const head = "<tr><th scope='col'>主题</th>" + groups.map((g) => `<th scope='col'>${esc(g)}</th>`).join("") + "</tr>";
    const body = themes.map((t) => {
      const cells = [`<th scope='row'>${esc(t.label)}</th>`];
      for (const g of groups) {
        const sub = codable.filter(([r]) => (r.group || "未分组") === g).map((x) => x[1]);
        const d = sub.length;
        const n = sub.filter((c) => (c.themes || []).some((x) => x.id === t.id)).length;
        const pct = d ? (100 * n / d).toFixed(1) : "—";
        cells.push(`<td class="num"><span class="pct">${d ? pct + "%" : "—"}</span><span class="frac">${n} / ${d}</span></td>`);
      }
      return "<tr>" + cells.join("") + "</tr>";
    }).join("");
    return `<div class="table-wrap"><table class="data">
      <caption>主题提及率：分母为各组可编码评论。一条评论可同时计入多个主题，故同一列内合计可超过 100%。</caption>
      <thead>${head}</thead><tbody>${body}</tbody>
    </table></div>`;
  }

  function emotionTable(sample, coding) {
    const groups = [];
    for (const r of sample) {
      const g = r.group || "未分组";
      if (!groups.includes(g)) groups.push(g);
    }
    const order = ["pos", "neu", "neg", "mix"];
    const rows = [];
    for (const r of sample) {
      const c = coding[r.comment_id];
      if (c && !c.skipped && !c.uncodable) rows.push([r, c]);
    }
    if (!rows.length) return "<p class='empty'>尚无可编码评论，无法统计整句情绪。</p>";
    const head = "<tr><th scope='col'>整句情绪</th>" + groups.map((g) => `<th scope='col'>${esc(g)}</th>`).join("") + "<th scope='col'>合计</th></tr>";
    const body = order.map((eid) => {
      const cells = [`<th scope='row'>${EMO_LABEL[eid]}</th>`];
      let totN = 0, totD = 0;
      for (const g of groups) {
        const sub = rows.filter(([r]) => (r.group || "未分组") === g).map((x) => x[1]);
        const n = sub.filter((c) => c.overall_emotion === eid).length;
        totN += n;
        totD += sub.length;
        const pct = sub.length ? (100 * n / sub.length).toFixed(1) : "—";
        cells.push(`<td class="num"><span class="pct">${sub.length ? pct + "%" : "—"}</span><span class="frac">${n} / ${sub.length}</span></td>`);
      }
      cells.push(`<td class="num"><span class="pct">${totD ? (100 * totN / totD).toFixed(1) + "%" : "—"}</span><span class="frac">${totN} / ${totD}</span></td>`);
      return "<tr>" + cells.join("") + "</tr>";
    }).join("");
    return `<div class="table-wrap"><table class="data">
      <caption>整句情绪构成：分母为各组可编码评论。每条评论只计入一种整句情绪，故同一列内合计为 100%。</caption>
      <thead>${head}</thead><tbody>${body}</tbody>
    </table></div>`;
  }

  function negativeTables(sample, coding, book) {
    const themes = book.themes || [];
    const groups = [];
    for (const r of sample) {
      const g = r.group || "未分组";
      if (!groups.includes(g)) groups.push(g);
    }
    const rows = [];
    for (const r of sample) {
      const c = coding[r.comment_id];
      if (c && !c.skipped && !c.uncodable) rows.push([r, c]);
    }
    if (!rows.length) return "<p class='empty'>尚无可编码评论，无法统计负面评论。</p>";
    const byG = {};
    groups.forEach((g) => { byG[g] = []; });
    for (const pair of rows) {
      const g = pair[0].group || "未分组";
      (byG[g] || (byG[g] = [])).push(pair);
    }
    const scaleHead = "<tr><th scope='col'>分组</th><th class='num' scope='col'>可编码</th><th class='num' scope='col'>整句负面</th><th class='num' scope='col'>负面占比</th></tr>";
    const scaleBody = groups.map((g) => {
      const sub = byG[g] || [];
      const d = sub.length;
      const n = sub.filter(([, c]) => c.overall_emotion === "neg").length;
      const pct = d ? (100 * n / d).toFixed(1) + "%" : "—";
      return `<tr><th scope="row">${esc(g)}</th><td class="num">${d}</td><td class="num">${n}</td><td class="num"><span class="pct">${pct}</span><span class="frac">${n} / ${d}</span></td></tr>`;
    }).join("");
    const totD = rows.length;
    const totN = rows.filter(([, c]) => c.overall_emotion === "neg").length;
    const totRow = `<tr><th scope="row">合计</th><td class="num">${totD}</td><td class="num">${totN}</td><td class="num"><span class="pct">${totD ? (100 * totN / totD).toFixed(1) + "%" : "—"}</span><span class="frac">${totN} / ${totD}</span></td></tr>`;
    const scale = `<div class="table-wrap"><table class="data">
      <caption>各组整句情绪为「负面」的规模。占比的分母为该组可编码评论。混合情绪不计入本表。</caption>
      <thead>${scaleHead}</thead><tbody>${scaleBody}${totRow}</tbody>
    </table></div>`;
    if (!totN) {
      return scale + "<p class='empty'>当前没有整句情绪为负面的可编码评论，故无法展示负面评论的主题构成。</p>";
    }
    const themeHead = "<tr><th scope='col'>主题</th>" + groups.map((g) => `<th class='num' scope='col'>${esc(g)}</th>`).join("") + "</tr>";
    const themeBody = themes.map((th) => {
      const cells = [`<th scope="row">${esc(th.label)}</th>`];
      for (const g of groups) {
        const neg = (byG[g] || []).filter(([, c]) => c.overall_emotion === "neg").map((x) => x[1]);
        const d = neg.length;
        if (!d) {
          cells.push(`<td class="num">—</td>`);
          continue;
        }
        const n = neg.filter((c) => (c.themes || []).some((x) => x.id === th.id)).length;
        cells.push(`<td class="num"><span class="pct">${(100 * n / d).toFixed(1)}%</span><span class="frac">${n} / ${d}</span></td>`);
      }
      return "<tr>" + cells.join("") + "</tr>";
    }).join("");
    const themeTbl = `<div class="table-wrap" style="margin-top:16px"><table class="data">
      <caption>负面评论中的主题提及率。分母为该组整句情绪为负面的可编码评论。一条评论可计入多个主题。无负面评论的组别以「—」表示。</caption>
      <thead>${themeHead}</thead><tbody>${themeBody}</tbody>
    </table></div>`;
    return scale + themeTbl;
  }

  function composeTable(sample) {
    const gcount = {};
    const scount = {};
    for (const r of sample) {
      const g = r.group || "未分组";
      const s = stratumLabel(r.stratum);
      gcount[g] = (gcount[g] || 0) + 1;
      scount[s] = (scount[s] || 0) + 1;
    }
    const n = sample.length || 1;
    const gRows = mostCommon(gcount).map(([g, c]) =>
      `<tr><th scope="row">${esc(g)}</th><td class="num">${c}</td><td class="num">${(100 * c / n).toFixed(1)}%</td></tr>`
    ).join("");
    const sRows = mostCommon(scount).map(([s, c]) =>
      `<tr><th scope="row">${esc(s || "未分层")}</th><td class="num">${c}</td><td class="num">${(100 * c / n).toFixed(1)}%</td></tr>`
    ).join("");
    return `<div class="split">
      <div class="table-wrap"><table class="data">
        <caption>按分组（产品 / 频道 / 账号）</caption>
        <thead><tr><th>分组</th><th class="num">条数</th><th class="num">占比</th></tr></thead>
        <tbody>${gRows}</tbody>
      </table></div>
      <div class="table-wrap"><table class="data">
        <caption>按分层（如热门、最新）</caption>
        <thead><tr><th>分层</th><th class="num">条数</th><th class="num">占比</th></tr></thead>
        <tbody>${sRows}</tbody>
      </table></div>
    </div>`;
  }

  function reportFig(f) {
    if (!f || !f.svg) return "";
    return `<div class="fig">${f.svg}</div>`;
  }

  function triCards(items) {
    if (!items || !items.length) return "";
    const cols = items.length === 1 ? 1 : items.length === 2 ? 2 : 3;
    return `<div class="tri cols-${cols}">${items.map((it) =>
      `<article class="gcard" style="--g:${it.color || "#3B6D8C"}"><h3><i></i>${esc(it.name)}${it.note ? `<span>${esc(it.note)}</span>` : ""}</h3>${it.body}</article>`
    ).join("")}</div>`;
  }

  function collectReport(sample, coding, book) {
    const themes = book.themes || [];
    const groups = [];
    for (const r of sample) {
      const g = r.group || "未分组";
      if (!groups.includes(g)) groups.push(g);
    }
    const cmap = colorsFor(groups);
    const byG = groups.map((name, i) => {
      const rows = sample.filter((r) => (r.group || "未分组") === name);
      let labeled = 0, skipped = 0, unlabeled = 0, unc = 0;
      const codable = [];
      const labeledPairs = [];
      for (const r of rows) {
        const c = coding[r.comment_id];
        if (!c) unlabeled += 1;
        else if (c.skipped) skipped += 1;
        else {
          labeled += 1;
          labeledPairs.push([r, c]);
          if (c.uncodable) unc += 1;
          else codable.push([r, c]);
        }
      }
      const themeHits = themes.map((t) => {
        const n = codable.filter(([, c]) => (c.themes || []).some((x) => x.id === t.id)).length;
        return { id: t.id, label: t.label, n, pct: codable.length ? 100 * n / codable.length : 0 };
      }).sort((a, b) => b.pct - a.pct || String(a.label).localeCompare(String(b.label), "zh"));
      const emo = { pos: 0, neu: 0, neg: 0, mix: 0 };
      for (const [, c] of codable) {
        if (emo[c.overall_emotion] != null) emo[c.overall_emotion] += 1;
      }
      const emoPct = {};
      ["pos", "neu", "neg", "mix"].forEach((k) => {
        emoPct[k] = codable.length ? 100 * emo[k] / codable.length : 0;
      });
      const negRows = codable.filter(([, c]) => c.overall_emotion === "neg");
      const negThemes = themes.map((t) => {
        const n = negRows.filter(([, c]) => (c.themes || []).some((x) => x.id === t.id)).length;
        return { id: t.id, label: t.label, n, pct: negRows.length ? 100 * n / negRows.length : 0 };
      }).sort((a, b) => b.pct - a.pct);
      const bySt = { hot: { labeled: 0, unc: 0 }, newest: { labeled: 0, unc: 0 } };
      for (const [r, c] of labeledPairs) {
        const st = stratumNorm(r.stratum);
        if (st === "hot") {
          bySt.hot.labeled += 1;
          if (c.uncodable) bySt.hot.unc += 1;
        } else if (st === "newest") {
          bySt.newest.labeled += 1;
          if (c.uncodable) bySt.newest.unc += 1;
        }
      }
      const top = themeHits.filter((t) => t.n > 0).slice(0, 3);
      return {
        name, color: colorOf(name, i, cmap), n: rows.length,
        labeled, skipped, unlabeled, unc, nCodable: codable.length,
        themes: themeHits, top, emo, emoPct,
        negN: negRows.length,
        negPct: codable.length ? 100 * negRows.length / codable.length : 0,
        negThemes, bySt,
      };
    });
    const sum = (fn) => byG.reduce((n, g) => n + fn(g), 0);
    const nCodable = sum((g) => g.nCodable);
    const nUnc = sum((g) => g.unc);
    const nNeg = sum((g) => g.negN);
    const hot = { labeled: sum((g) => g.bySt.hot.labeled), unc: sum((g) => g.bySt.hot.unc) };
    const newest = { labeled: sum((g) => g.bySt.newest.labeled), unc: sum((g) => g.bySt.newest.unc) };
    return { groups: byG, themes, nCodable, nUnc, nNeg, hot, newest, hasStrata: hot.labeled + newest.labeled > 0 };
  }

  function themeBody(g) {
    if (!g.nCodable) return "<p>本组尚无可编码评论，主题提及率暂缺。</p>";
    const top = g.top;
    if (!top.length) return `<p>可编码 ${g.nCodable} 条，尚未标出主题。</p>`;
    const p1 = top.map((t) => `${esc(t.label)}占 ${fmtNum(t.pct, true)}`).join("，") + "。";
    let p2;
    if (top.length >= 2 && top[0].pct - top[1].pct < 8) {
      p2 = `${esc(top[0].label)}与${esc(top[1].label)}大体相当，尚未形成单一主轴。`;
    } else if (top[0].pct >= 40) p2 = `${esc(top[0].label)}明显高于其余主题，讨论相对集中。`;
    else if (top[0].pct < 22) p2 = "各主题提及率均不高，议题较为分散。";
    else p2 = `讨论主轴偏向${esc(top[0].label)}。`;
    const rest = g.themes.filter((t) => t.n > 0).slice(3, 5);
    if (rest.length) p2 += ` 其后是${rest.map((t) => esc(t.label)).join("、")}。`;
    return `<p>${p1}</p><p>${p2}</p>`;
  }

  function themeCallout(stats) {
    const axes = stats.groups.filter((g) => g.nCodable && g.top[0]);
    if (!axes.length) return "主题比例仅来自可编码评论。一条评论可计入多个主题，列内合计可以超过 100%。";
    if (axes.length === 1) {
      return `可编码评论最常谈到「${esc(axes[0].top[0].label)}」（${fmtNum(axes[0].top[0].pct, true)}）。一条评论可计入多个主题，故各主题合计可以超过 100%。公开评论不能代表全体用户。`;
    }
    const ids = [...new Set(axes.map((g) => g.top[0].id))];
    if (ids.length === 1) {
      return `各组最常提及的主题同为「${esc(axes[0].top[0].label)}」，但占比并不相同。结构接近，不等于口碑接近，也不宜据此判断哪一组更好。`;
    }
    return axes.map((g) => `${esc(g.name)}偏向${esc(g.top[0].label)}`).join("，") + "。差异来自分组对象与样本窗口，横比的是公开评区当时在谈什么，不是哪一边更好。";
  }

  function emoLeadEmo(g) {
    const e = g.emoPct;
    return [["neu", "中性", e.neu], ["pos", "正面", e.pos], ["neg", "负面", e.neg], ["mix", "混合", e.mix]]
      .sort((a, b) => b[2] - a[2])[0];
  }

  function emoBody(g) {
    if (!g.nCodable) return "<p>本组尚无可编码评论。</p>";
    const e = g.emoPct;
    const p1 = `正面 ${fmtNum(e.pos, true)}，中性 ${fmtNum(e.neu, true)}，负面 ${fmtNum(e.neg, true)}，混合 ${fmtNum(e.mix, true)}。`;
    const lead = emoLeadEmo(g);
    const second = [["neu", "中性", e.neu], ["pos", "正面", e.pos], ["neg", "负面", e.neg], ["mix", "混合", e.mix]]
      .sort((a, b) => b[2] - a[2])[1];
    let p2;
    if (second && lead[2] - second[2] < 6 && second[2] > 0) {
      p2 = `${lead[1]}与${second[1]}大体相当。宜并读，不宜只看其中一种态度。`;
    } else if (lead[0] === "neu") p2 = "中性占比最高。中性句常见于说明、提问或考据，不等于口碑低迷，也不等于讨论冷清。";
    else if (lead[0] === "pos") p2 = "正面占比最高。正面高，不等于所有人都满意；仍须同时阅读中性与负面。";
    else if (lead[0] === "neg") p2 = "负面占比最高。这只说明本窗口可编码评论中批评更集中，不能外推到未发言的用户。";
    else p2 = "混合情绪相对突出，不少评论同时包含肯定与不满。";
    if (e.neg >= 12 && lead[0] !== "neg" && !(second && second[0] === "neg" && lead[2] - second[2] < 6)) {
      p2 += ` 负面已达 ${fmtNum(e.neg, true)}，宜对照其主题构成。`;
    }
    return `<p>${p1}</p><p>${p2}</p>`;
  }

  function emoCallout(stats) {
    const live = stats.groups.filter((g) => g.nCodable);
    if (!live.length) return "整句情绪每条只记一种态度。混合情绪计入构成，但不并入负面评论分析。";
    if (live.length === 1) {
      const lead = emoLeadEmo(live[0]);
      return `本样本以「${lead[1]}」为主（${fmtNum(lead[2], true)}）。中性高不等于口碑差，正面高也不等于批评不存在。`;
    }
    return "中性占比高，不等于口碑差；正面占比高，也不等于批评不存在。整句情绪按一条评论只记一种态度，不能加总各主题情绪。";
  }

  function noiseBody(g) {
    if (!g.labeled) return "<p>本组尚无已标注评论。</p>";
    const rate = 100 * g.unc / g.labeled;
    const p1 = `已标注 ${g.labeled} 条，其中无法编码 ${g.unc} 条（${fmtNum(rate, true)}）。`;
    const h = g.bySt.hot, n = g.bySt.newest;
    let p2;
    if (h.labeled && n.labeled) {
      const hp = 100 * h.unc / h.labeled, np = 100 * n.unc / n.labeled;
      p2 = `热门层 ${fmtNum(hp, true)}（${h.unc}/${h.labeled}），最新层 ${fmtNum(np, true)}（${n.unc}/${n.labeled}）。`;
      if (np > hp + 8) p2 += " 最新层明显更吵。若把最新层原样计入主题比例，有效讨论会被冲淡。";
      else if (hp > np + 8) p2 += " 热门层无法编码比例更高，需核对该层是否混入跟风短句。";
      else p2 += " 两层噪音差距不大。";
    } else p2 = "无法编码计入已标注，但不进入主题与情绪的分母。";
    return `<p>${p1}</p><p>${p2}</p>`;
  }

  function noiseCallout(stats) {
    const { hot, newest } = stats;
    if (hot.labeled && newest.labeled) {
      const hp = 100 * hot.unc / hot.labeled, np = 100 * newest.unc / newest.labeled;
      if (np > hp + 8) return `最新层无法编码 ${fmtNum(np, true)}，高于热门层的 ${fmtNum(hp, true)}。主题和情绪只用可编码评论；全部样本只用来观察噪音分布。`;
      return `无法编码不进入主题与情绪比例。热门层 ${fmtNum(hp, true)}，最新层 ${fmtNum(np, true)}。`;
    }
    return "无法编码计入已标注，但不进入主题、情绪与负面评论统计的分母。";
  }

  function negBody(g) {
    if (!g.nCodable) return "<p>本组尚无可编码评论。</p>";
    if (!g.negN) {
      return `<p>可编码 ${g.nCodable} 条中，没有整句情绪为负面的评论。</p><p>这不表示没有批评，只表示按整句口径，本窗口未标出负面。</p>`;
    }
    const top = g.negThemes.filter((t) => t.n > 0).slice(0, 3);
    const p1 = `整句负面 ${g.negN} / ${g.nCodable}（${fmtNum(g.negPct, true)}）。`;
    const p2 = top.length
      ? `这些负面评论主要谈到${top.map((t) => `${esc(t.label)}（${fmtNum(t.pct, true)}）`).join("、")}。一条负面评论可计入多个主题。`
      : "负面评论尚未标出主题。";
    return `<p>${p1}</p><p>${p2}</p>`;
  }

  function negCallout(stats) {
    const live = stats.groups.filter((g) => g.negN);
    if (!live.length) return "混合情绪计入整句情绪构成，但不并入本部分。";
    if (live.length === 1) {
      const g = live[0];
      const top = g.negThemes.find((t) => t.n > 0);
      return `整句负面集中在「${esc(g.name)}」${top ? `，并较多谈到${esc(top.label)}` : ""}。点赞高低描述的是传得开不开，不能直接当作态度强度。`;
    }
    const ranked = live.slice().sort((a, b) => b.negPct - a.negPct);
    return `${esc(ranked[0].name)}的整句负面占比最高（${fmtNum(ranked[0].negPct, true)}）。混合情绪不计入本部分。横比的是批评在评区里有多可见，不是产品孰优孰劣。`;
  }

  function emoOneLine(g) {
    if (!g.nCodable) return "—";
    const lead = emoLeadEmo(g);
    return `${lead[1]}为主（${fmtNum(lead[2], true)}）`;
  }

  function compareRow(label, cells) {
    return `<tr><th>${label}</th>${cells.map((c) => `<td>${c}</td>`).join("")}</tr>`;
  }

  function compareSection(stats) {
    if (stats.groups.length < 2 || !stats.nCodable) return "";
    const gs = stats.groups;
    const head = `<tr><th>看什么</th>${gs.map((g) => `<th>${esc(g.name)}</th>`).join("")}</tr>`;
    const body = [
      compareRow("讨论主轴", gs.map((g) => g.nCodable && g.top[0] ? `${esc(g.top[0].label)}（${fmtNum(g.top[0].pct, true)}）` : "—")),
      compareRow("情绪结构", gs.map(emoOneLine)),
      compareRow("无法编码", gs.map((g) => g.labeled ? `${g.unc} / ${g.labeled}（${fmtNum(100 * g.unc / g.labeled, true)}）` : "—")),
      compareRow("整句负面", gs.map((g) => g.nCodable ? `${fmtNum(g.negPct, true)}（${g.negN}/${g.nCodable}）` : "—")),
    ].join("");
    const cards = gs.map((g) => {
      let bodyHtml;
      if (!g.nCodable) bodyHtml = "<p>本组尚无可编码评论，暂不概括。</p>";
      else {
        const axis = g.top[0] ? g.top[0].label : "尚未形成主题";
        bodyHtml = `<p>主轴是${esc(axis)}，情绪${emoOneLine(g)}。这是该分组在本窗口公开评区中的结构，不是产品优劣结论。</p>`;
      }
      return { name: g.name, color: g.color, note: `可编码 ${g.nCodable} 条`, body: bodyHtml };
    });
    return `<section class="panel" id="compare">
  <div class="hd">
    <div class="num">对照</div>
    <h2>各组在本窗口中的位置</h2>

    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const c = db.coding[row.comment_id];
      if (!matchCodingFilter(c, filter || "all")) continue;
      if (!matchSlice(row, c, slice)) continue;
      const st = codingStatus(c);
      items.push({
        index: i,
        comment_id: row.comment_id,
        text: String(row.comment_text || "").replace(/\s+/g, " ").trim(),
        group: row.group || "未分组",
        stratum: row.stratum || "",
        date: row.comment_date || "",
        likes: row.like_count,
        status: st.id,
        status_label: st.label,
        theme_labels: ((c && c.themes) || []).map((t) => tmap[t.id] || t.id),
        emotion: (c && c.overall_emotion) || "",
        emotion_label: EMO_LABEL[(c && c.overall_emotion) || ""] || "",
      });
    }
    const filtLab = ({
      all: "全部", unlabeled: "未标注", labeled: "已标注", skipped: "已跳过",
      uncodable: "无法编码", auto: "词典初标", hand: "人工标注",
    })[filter || "all"] || filter;
    const sliceLab = sliceTitle(slice, book);
    return {
      total: items.length,
      items,
      filter: filter || "all",
      slice: slice || null,
      title: sliceLab ? `${filtLab === "全部" ? sliceLab : filtLab + " · " + sliceLab}` : filtLab,
    };
  }

  function deskCharts(sample, coding, book) {
    const counts = codingCounts(sample, coding);
    const statusIds = ["unlabeled", "labeled", "skipped", "uncodable", "auto", "hand"];
    const statusPairs = statusIds.map((id) => {
      const meta = STATUS_META[id];
      const n = counts[id] || 0;
      return [meta.label, n, `${meta.label}：${n} 条`, { kind: "status", id }];
    });
    const statusColors = {};
    statusIds.forEach((id) => { statusColors[STATUS_META[id].label] = STATUS_META[id].color; });
    const out = [{
      id: "status",
      title: "标注状态",
      caption: "点击柱子，左侧列出该状态的全部评论。",
      svg: bars("标注状态", statusPairs, {
        h: 210, color_mode: "group", colors: statusColors, show_legend: false, ylab: "条数",
      }),
    }];
    const more = codingCharts(sample, coding, book).filter((c) => c.id === "theme" || c.id === "emo" || c.id === "donut" || c.id === "unc");
    more.forEach((c) => {
      if (c.id === "theme") c.caption = "点击柱子，列出标了该主题的评论。";
      if (c.id === "emo") c.caption = "点击色块，列出该整句情绪的评论。";
      if (c.id === "donut") c.caption = "点击扇区，列出该整句情绪的评论。";
      if (c.id === "unc") c.caption = "点击柱子，列出无法编码的评论。";
      out.push(c);
    });
    if (out.length === 1) out[0].wide = true;
    return out;
  }

  function filteredIndices(sample, coding, filter) {
    const out = [];
    for (let i = 0; i < sample.length; i++) {
      if (matchCodingFilter(coding[sample[i].comment_id], filter)) out.push(i);
    }
    return out;
  }

  function pickFilteredIndex(indices, requested) {
    if (!indices.length) return -1;
    const req = Math.max(0, Number(requested) || 0);
    if (indices.indexOf(req) >= 0) return req;
    const next = indices.find((i) => i >= req);
    return next != null ? next : indices[0];
  }

  function getCodingItem(index, filter) {
    const rows = db.sample;
    if (!rows.length) throw new Error("尚未抽取样本。请先完成抽样。");
    const filt = filter || "all";
    const indices = filteredIndices(rows, db.coding, filt);
    const counts = codingCounts(rows, db.coding);
    const codedN = labeledCount(rows, db.coding);
    const base = {
      filter: filt,
      counts,
      total: rows.length,
      filtered_total: indices.length,
      coded_n: codedN,
      codebook: db.codebook,
    };
    if (!indices.length) {
      return Object.assign(base, { empty: true, index: 0, pos: 0, row: null, coding: null });
    }
    const idx = pickFilteredIndex(indices, index);
    const at = indices.indexOf(idx);
    return Object.assign(base, {
      empty: false,
      index: idx,
      pos: at + 1,
      prev_index: at > 0 ? indices[at - 1] : null,
      next_index: at < indices.length - 1 ? indices[at + 1] : null,
      row: rows[idx],
      coding: db.coding[rows[idx].comment_id],
    });
  }

  function saveCoding(body) {
    const id = body && body.comment_id;
    if (!id) throw new Error("缺少评论编号。");
    if (!db.sample.some((r) => r.comment_id === id)) {
      throw new Error("这条不在当前样本中。请重新抽样后再标注。");
    }
    let rec;
    if (body.skip) {
      rec = {
        skipped: true,
        uncodable: false,
        themes: [],
        overall_emotion: "na",
        memo: body.memo || "",
        auto: false,
      };
    } else if (body.uncodable) {
      rec = { uncodable: true, themes: [], overall_emotion: "na", memo: body.memo || "", auto: false, skipped: false };
    } else {
      const maxT = Number(db.codebook.max_themes || 3);
      const themes = (body.themes || []).slice(0, maxT);
      const allowed = new Set((db.codebook.themes || []).map((t) => t.id));
      const clean = themes.filter((t) => t && allowed.has(t.id));
      if (!clean.length) throw new Error("请至少选择一个主题，或勾选「无法编码」。");
      const emo = body.overall_emotion || "";
      if (!["pos", "neu", "neg", "mix"].includes(emo)) {
        throw new Error("请选择整句情绪后再保存。");
      }
      rec = {
        uncodable: false,
        skipped: false,
        themes: clean,
        overall_emotion: emo,
        memo: body.memo || "",
        auto: false,
      };
    }
    db.coding[id] = rec;
    persist();
    return { ok: true, coded_n: labeledCount(db.sample, db.coding) };
  }

  function clearCoding() {
    const n = Object.keys(db.coding || {}).length;
    db.coding = {};
    persist();
    return { ok: true, cleared: n, coded_n: 0 };
  }

  function state() {
    const src = db.source, samp = db.sample, coding = db.coding;
    const counts = codingCounts(samp, coding);
    return {
      meta: db.meta,
      source_n: src.length,
      sample_n: samp.length,
      coded_n: counts.labeled,
      skipped_n: counts.skipped,
      unlabeled_n: counts.unlabeled,
      counts,
      codebook: db.codebook,
      has_source: !!src.length,
      has_sample: !!samp.length,
    };
  }

  async function readFile(file) {
    const name = file.name || "upload.csv";
    const buf = await file.arrayBuffer();
    const lower = name.toLowerCase();
    if (lower.endsWith(".xlsx") || lower.endsWith(".xlsm")) return Object.assign({ name }, await readXlsx(buf));
    return Object.assign({ name }, parseCsv(decodeBytes(buf)));
  }

  async function handleUpload(files, append) {
    if (!files || !files.length) throw new Error("请先选择表格。");
    const incoming = [];
    for (const f of files) {
      const { name, headers: hdrs, rows } = await readFile(f);
      incoming.push({
        file: { name, rows: rows.length, headers: hdrs },
        packed: { name, headers: hdrs, rows },
      });
    }
    const canAppend = append && db.upload && (db.upload.packed || []).length;
    let packed = [];
    let saved = [];
    if (canAppend) {
      packed = db.upload.packed.slice();
      saved = (db.upload.files || []).slice();
      const idxByName = new Map(packed.map((p, i) => [p.name, i]));
      for (const item of incoming) {
        const i = idxByName.get(item.packed.name);
        if (i == null) {
          idxByName.set(item.packed.name, packed.length);
          packed.push(item.packed);
          saved.push(item.file);
        } else {
          packed[i] = item.packed;
          saved[i] = item.file;
        }
      }
    } else {
      packed = incoming.map((x) => x.packed);
      saved = incoming.map((x) => x.file);
    }
    const headers = [];
    const seenH = new Set();
    for (const p of packed) {
      for (const h of p.headers || []) {
        if (!h || seenH.has(h)) continue;
        seenH.add(h);
        headers.push(h);
      }
    }
    const prevMap = canAppend ? (db.upload.mapping || {}) : {};
    const guessed = guessMapping(headers);
    const mapping = Object.assign({}, guessed, prevMap);
    const preview = (packed[0] && packed[0].rows ? packed[0].rows.slice(0, 8) : []);
    db.upload = {
      files: saved,
      packed,
      headers,
      preview,
      mapping,
      committed: false,
      files_ready: true,
    };
    persist();
    return {
      files: saved,
      headers,
      preview,
      mapping,
      committed: false,
      files_ready: true,
      appended: !!canAppend,
    };
  }

  function importSession() {
    const src = db.source;
    const session = db.upload;
    if (session && (session.files || []).length) {
      return Object.assign({}, session, {
        files_ready: true,
        source_n: src.length,
        committed: !!src.length,
        packed: undefined,
      });
    }
    if (src.length) {
      const counts = countBy(src, "import_file");
      return {
        files: mostCommon(counts).map(([name, n]) => ({ name: name || "source.csv", rows: n, headers: [] })),
        headers: [],
        preview: src.slice(0, 8),
        mapping: db.meta.mapping || {},
        files_ready: false,
        source_n: src.length,
        committed: true,
        from_source: true,
      };
    }
    return { files: [], headers: [], preview: [], mapping: {}, files_ready: false, source_n: 0, committed: false };
  }

  async function commitImport(mapping, studyName) {
    if (!db.upload || !(db.upload.packed || []).length) throw new Error("请先上传表格。");
    if (!mapping || !mapping.comment_text) throw new Error("必须指定「评论正文」对应哪一列。");
    const merged = [];
    const seen = new Set();
    for (const part of db.upload.packed) {
      const rows = await applyMapping(part.rows, mapping, part.name);
      for (const r of rows) {
        if (seen.has(r.comment_id)) continue;
        seen.add(r.comment_id);
        merged.push(r);
      }
    }
    if (!merged.length) throw new Error("映射之后没有可用评论。请确认正文列选对了。");
    db.source = merged;
    db.meta.study_name = studyName || "未命名研究";
    db.meta.step = "source";
    db.meta.mapping = mapping;
    db.meta.imported = merged.length;
    db.upload.mapping = mapping;
    db.upload.committed = true;
    db.upload.source_n = merged.length;
    persist();
    return { n: merged.length, groups: countBy(merged, "group") };
  }

  function resetStudy() {
    const salt = db.salt;
    const codebook = db.codebook;
    db = emptyDb();
    db.salt = salt;
    db.codebook = codebook;
    persist();
    return { ok: true, source_n: 0, sample_n: 0, coded_n: 0 };
  }

  const FALLBACK_THEME_KW = {
    T1: ["外形", "人设", "建模", "立绘", "画风", "美型", "好看", "皮肤", "服装", "过场", "PV", "演出", "角色"],
    T2: ["战斗", "手感", "打击感", "技能", "连招", "副本", "boss", "难度", "操作", "开荒", "伤害", "输出"],
    T3: ["剧情", "主线", "支线", "叙事", "考据", "刀了", "泪目", "台词", "故事", "过场动画", "剧情杀"],
    T4: ["地图", "跑图", "传送", "探索", "采集", "解谜", "宝箱", "锚点", "减负", "开图"],
    T5: ["养成", "材料", "体力", "树脂", "肝度", "突破", "天赋", "武器", "圣遗物", "声骸", "等级", "编队"],
    T6: ["抽卡", "卡池", "保底", "氪金", "月卡", "通行证", "价格", "零氪", "课金", "歪了", "大保底"],
    T7: ["版本", "活动", "长草", "更新", "内容量", "重复", "入坑", "复刷", "版本节奏"],
    T8: ["优化", "帧率", "卡顿", "闪退", "bug", "BUG", "延迟", "画质", "包体", "加载", "崩溃", "掉帧"],
    T9: ["配音", "CV", "字幕", "语音", "中配", "日配", "台词", "文本"],
    T10: ["官方", "评区", "前瞻", "运营", "客服", "补偿", "问卷", "直播", "维护"],
  };

  const POS_WORDS = "好看 好听 好玩 喜欢 爱了 绝了 神作 精品 优秀 精美 流畅 良心 期待 支持 推荐 满意 惊喜 牛逼 好评 不错 过瘾 上头 沉浸 感动 泪目 强势 给力 用心 细节 质量".split(" ");
  const NEG_WORDS = "难看 难听 不好玩 讨厌 垃圾 拉胯 拉了 差评 失望 劝退 退坑 无聊 枯燥 肝爆 肝疼 氪金 割韭菜 圈钱 抄袭 套皮 卡顿 闪退 掉帧 发热 优化差 有病 离谱 无语 恶心 智商税 敷衍 缩水 背刺 骗钱".split(" ");
  const UNC_PHRASES = ["前排", "沙发", "打卡", "路过", "占楼", "冒泡", "签到", "留名", "来了", "来啦", "好耶", "冲冲冲", "awsl", "yyds"];

  function splitKw(s) {
    return String(s || "")
      .split(/[\s,，、；;\/\|]+/)
      .map((x) => x.trim())
      .filter((x) => x.length >= 2);
  }

  function themeKeywords(th) {
    const extra = splitKw(th.keywords);
    if (extra.length) return extra;
    const fromLabel = splitKw(th.label).concat(splitKw(th.hint));
    const fb = FALLBACK_THEME_KW[th.id] || [];
    const seen = new Set();
    const out = [];
    for (const w of extra.concat(fromLabel).concat(fb)) {
      if (w.length < 2 || seen.has(w)) continue;
      seen.add(w);
      out.push(w);
    }
    return out;
  }

  function countHits(text, words) {
    let n = 0;
    const hits = [];
    for (const w of words) {
      if (!w || w.length < 2) continue;
      if (text.includes(w)) {
        n += Math.min(3, w.length);
        hits.push(w);
      }
    }
    return { n, hits };
  }

  function stripNoise(text) {
    return String(text || "")
      .replace(/\[[^\]]{1,24}\]/g, " ")
      .replace(/https?:\/\/\S+/gi, " ")
      .replace(/www\.\S+/gi, " ")
      .replace(/@[\w\u4e00-\u9fff.\-]{1,32}/g, " ")
      .replace(/[^\u4e00-\u9fffA-Za-z0-9]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function looksUncodable(raw, cleaned) {
    const t = String(raw || "").trim();
    if (t.length < 4) return true;
    if (!cleaned || cleaned.length < 2) return true;
    const compact = cleaned.replace(/\s/g, "");
    if (compact.length <= 4 && UNC_PHRASES.some((p) => t.includes(p) || compact.includes(p))) return true;
    if (/^(哈哈+|hhh+|www+|233+|666+|111+|草+|冲+|来了+|好耶+)$/i.test(compact)) return true;
    const cjk = (cleaned.match(/[\u4e00-\u9fff]/g) || []).length;
    const lat = (cleaned.match(/[A-Za-z]/g) || []).length;
    if (cjk + lat < 2) return true;
    return false;
  }

  function guessEmotion(text) {
    const pos = countHits(text, POS_WORDS).n;
    const neg = countHits(text, NEG_WORDS).n;
    if (pos > 0 && neg > 0) return "mix";
    if (pos > 0) return "pos";
    if (neg > 0) return "neg";
    return "neu";
  }

  function autoCodeOne(row, codebook) {
    const raw = String(row.comment_text || row.text || "");
    const cleaned = stripNoise(raw);
    const maxT = Math.max(1, Number(codebook.max_themes || 3));
    const scored = [];
    for (const th of codebook.themes || []) {
      const kws = themeKeywords(th);
      const { n, hits } = countHits(raw, kws);
      if (n > 0) scored.push({ th, n, hits });
    }
    scored.sort((a, b) => b.n - a.n);
    const top = scored.slice(0, maxT);
    const themes = [];
    for (const s of top) {
      if (s.n < 2 && top[0] && top[0].n >= 4 && s !== top[0]) continue;
      themes.push({ id: s.th.id, emotion: guessEmotion(raw) });
    }
    if (!themes.length) {
      if (looksUncodable(raw, cleaned)) {
        return {
          uncodable: true,
          skipped: false,
          themes: [],
          overall_emotion: "na",
          memo: "词典初标：判定为无法编码",
          auto: true,
        };
      }
      return null;
    }
    const emos = themes.map((x) => x.emotion);
    let overall = "neu";
    if (emos.includes("mix") || (emos.includes("pos") && emos.includes("neg"))) overall = "mix";
    else if (emos.every((e) => e === "pos")) overall = "pos";
    else if (emos.every((e) => e === "neg")) overall = "neg";
    else if (emos.includes("pos") && !emos.includes("neg")) overall = "pos";
    else if (emos.includes("neg") && !emos.includes("pos")) overall = "neg";
    return {
      uncodable: false,
      skipped: false,
      themes,
      overall_emotion: overall,
      memo: "词典初标（本机关键词匹配），请人工复核",
      auto: true,
    };
  }

  function runAutoCode(overwriteAuto) {
    const codebook = db.codebook && db.codebook.themes ? db.codebook : defaultCodebook();
    let n = 0;
    let skipped = 0;
    let uncodableN = 0;
    let noHit = 0;
    for (const row of db.sample || []) {
      const cid = row.comment_id;
      const prev = db.coding[cid];
      if (prev) {
        if (!overwriteAuto) {
          skipped += 1;
          continue;
        }
        if (prev.auto !== true) {
          skipped += 1;
          continue;
        }
      }
      const coded = autoCodeOne(row, codebook);
      if (!coded) {
        noHit += 1;
        continue;
      }
      db.coding[cid] = coded;
      n += 1;
      if (coded.uncodable) uncodableN += 1;
    }
    persist();
    return { n, skipped, uncodable_n: uncodableN, no_hit: noHit };
  }

  async function request(path, opts) {
    opts = opts || {};
    const method = (opts.method || "GET").toUpperCase();
    const url = new URL(path, "https://local.fxzp/");
    const p = url.pathname;
    const q = Object.fromEntries(url.searchParams.entries());
    const body = opts.json || {};
    try {
      if (p === "/api/state") return state();
      if (p === "/api/meta" && method === "POST") {
        if (body.study_name != null) db.meta.study_name = String(body.study_name).trim().slice(0, 80) || "未命名研究";
        if (body.step && ["import", "source", "sample", "codebook", "coding", "report"].includes(body.step)) {
          db.meta.step = body.step;
        }
        persist();
        return state();
      }
      if (p === "/api/reset" && method === "POST") return resetStudy();
      if (p === "/api/import/upload" && method === "POST") {
        return await handleUpload(opts.files, q.append === "1" || q.append === "true");
      }
      if (p === "/api/import/session" && method === "GET") return importSession();
      if (p === "/api/import/session" && method === "PUT") {
        if (!db.upload || !(db.upload.files || []).length) throw new Error("尚无待写入的上传稿。请先选择表格。");
        db.upload.mapping = body.mapping || {};
        if (body.study_name) db.meta.study_name = body.study_name;
        persist();
        return db.upload;
      }
      if (p === "/api/import/commit" && method === "POST") {
        return await commitImport(body.mapping, body.study_name);
      }
      if (p === "/api/source") {
        let rows = db.source;
        const ql = (q.q || "").toLowerCase();
        if (ql) {
          rows = rows.filter((r) =>
            (r.comment_text || "").toLowerCase().includes(ql)
            || (r.group || "").toLowerCase().includes(ql)
            || (r.source_title || "").toLowerCase().includes(ql)
          );
        }
        const offset = Number(q.offset || 0), limit = Number(q.limit || 40);
        return { total: rows.length, rows: rows.slice(offset, offset + limit) };
      }
      if (p === "/api/source/charts") {
        return { charts: sourceCharts(db.source), stats: sourceStats(db.source) };
      }
      if (p === "/api/sample" && method === "POST") {
        if (!db.source.length) throw new Error("尚无源数据。请先导入表格并写入。");
        const start = body.window_start || "";
        const end = body.window_end || "";
        if (start && end && start > end) throw new Error("起始日期不能晚于结束日期。");
        const nCell = Math.floor(Number(body.n_per_cell));
        if (!nCell || nCell < 1) throw new Error("每组每层抽取条数须为正整数。");
        const marked = markWindow(db.source, start, end);
        db.source = marked;
        const stratumField = body.stratum_field === "__none__" ? "__none__" : (body.stratum_field || "stratum");
        const picked = drawSample(
          marked, body.seed, nCell, body.group_field || "group",
          stratumField, body.window_only !== false
        );
        if (!picked.length) throw new Error("当前日期范围或分层条件下抽不到评论。");
        const keep = new Set(picked.map((r) => r.comment_id));
        const nextCoding = {};
        let kept = 0;
        for (const cid of Object.keys(db.coding || {})) {
          if (keep.has(cid)) {
            nextCoding[cid] = db.coding[cid];
            kept += 1;
          }
        }
        db.sample = picked;
        db.coding = nextCoding;
        db.meta.step = "sample";
        db.meta.sample = body;
        db.meta.sample_n = picked.length;
        db.meta.window_n = marked.filter((r) => r.in_window !== "0").length;
        persist();
        return {
          n: picked.length,
          window_n: db.meta.window_n,
          kept_coding: kept,
          groups: countBy(picked, "group"),
          strata: countBy(picked, "stratum"),
        };
      }
      if (p === "/api/sample") {
        const offset = Number(q.offset || 0), limit = Number(q.limit || 40);
        return { total: db.sample.length, rows: db.sample.slice(offset, offset + limit) };
      }
      if (p === "/api/codebook" && method === "GET") return db.codebook;
      if (p === "/api/codebook" && method === "POST") {
        if (db.codebook.frozen) throw new Error("编码表已冻结。如需改主题，先解冻草稿。");
        const data = Object.assign({}, body.data);
        data.frozen = false;
        data.version = Number(db.codebook.version || 1);
        validateBook(data);
        db.codebook = data;
        persist();
        return data;
      }
      if (p === "/api/codebook/template" && method === "POST") {
        if (db.codebook.frozen) throw new Error("已冻结，不能重置模板。先解冻。");
        db.codebook = defaultCodebook();
        persist();
        return db.codebook;
      }
      if (p === "/api/codebook/empty" && method === "POST") {
        if (db.codebook.frozen) throw new Error("已冻结。");
        const data = defaultCodebook();
        data.themes = [{ id: "T1", label: "新主题", hint: "", keywords: "" }];
        db.codebook = data;
        persist();
        return data;
      }
      if (p === "/api/codebook/freeze" && method === "POST") {
        validateBook(db.codebook);
        db.codebook.frozen = true;
        db.codebook.version = Number(db.codebook.version || 1);
        persist();
        return db.codebook;
      }
      if (p === "/api/codebook/unfreeze" && method === "POST") {
        db.codebook.frozen = false;
        persist();
        return db.codebook;
      }
      if (p === "/api/coding/item") {
        return getCodingItem(q.index, q.filter);
      }
      if (p === "/api/coding/save" && method === "POST") {
        return saveCoding(body);
      }
      if (p === "/api/coding/auto" && method === "POST") {
        return runAutoCode(!!body.overwrite_auto);
      }
      if (p === "/api/coding/clear" && method === "POST") {
        return clearCoding();
      }
      if (p === "/api/coding/list") {
        let slice = null;
        if (q.slice) {
          try { slice = JSON.parse(q.slice); } catch (_) { slice = null; }
        }
        return listCoding(q.filter, slice);
      }
      if (p === "/api/coding/desk-charts") {
        return { charts: deskCharts(db.sample, db.coding, db.codebook) };
      }
      if (p === "/api/coding/charts") {
        return { charts: codingCharts(db.sample, db.coding, db.codebook) };
      }
      if (p === "/api/report.html") return buildReport();
      throw new Error("未知接口 " + p);
    } catch (e) {
      throw e;
    }
  }

  function exportStudy() {
    return JSON.stringify({
      kind: "fxzp-study",
      version: 1,
      saved_at: new Date().toISOString(),
      data: db,
    }, null, 2);
  }

  function importStudy(obj) {
    const data = obj && obj.data ? obj.data : obj;
    if (!data || typeof data !== "object") throw new Error("不是有效的研究文件。");
    db = Object.assign(emptyDb(), data);
    if (!db.codebook) db.codebook = defaultCodebook();
    persist();
    return state();
  }

  global.Engine = {
    ready,
    init,
    request,
    exportStudy,
    importStudy,
    buildReport,
  };
  init();
})(window);

  </script>
  <script>
const STEPS = [

const FIELDS = [

];

const EMO = [
  ["pos", "正面"],
  ["neu", "中性"],
  ["neg", "负面"],

];

let state = { step: "import", codebook: { themes: [], frozen: false }, source_n: 0, sample_n: 0, coded_n: 0 };
let mapping = {};
let codingIndex = 0;
let codingFilter = "all";
let currentItem = null;
let restoredStep = false;
let toastTimer = null;
let codingKeyHandler = null;

const CODING_FILTERS = [
  ["all", "全部"],

  ["labeled", "已标注"],
  ["skipped", "已跳过"],
