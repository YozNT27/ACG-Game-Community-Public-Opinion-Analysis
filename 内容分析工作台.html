function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}

async function api(path, opts = {}) {
  await Engine.ready;
  const next = { ...opts };
  if (opts.body instanceof FormData) {
    next.files = opts.body.getAll("files");
    delete next.body;
  } else if (typeof opts.body === "string") {
    try { next.json = JSON.parse(opts.body); } catch (_) {}
    delete next.body;
  }
  try {
    return await Engine.request(path, next);
  } catch (e) {
    throw new Error(e.message || String(e));
  }
}

async function persistMeta(extra) {
  try {
    await api("/api/meta", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(extra || {}),
    });
  } catch (_) {}
}

async function go(step) {
  state.step = step;
  await persistMeta({ step });
  await render();
}

async function refresh() {
  state = { ...state, ...(await api("/api/state")) };
  if (!restoredStep) {
    const s = state.meta?.step;
    if (s && STEPS.some((x) => x[0] === s)) state.step = s;
    restoredStep = true;
  }
  const name = document.getElementById("studyName");
  if (name && !name.dataset.dirty) name.value = state.meta?.study_name || "";
  const skip = state.skipped_n || 0;
  document.getElementById("asideStatus").textContent =
    `源数据 ${state.source_n} 条 · 样本 ${state.sample_n} 条 · 已标注 ${state.coded_n} 条` +
    (skip ? ` · 已跳过 ${skip} 条` : "");
}

function renderNav() {
  document.getElementById("steps").innerHTML = STEPS.map(([id, lab], i) =>
    `<button type="button" class="${state.step === id ? "on" : ""}" data-step="${id}" aria-current="${state.step === id ? "step" : "false"}"><span class="n">${i + 1}</span>${lab}</button>`
  ).join("");
  document.querySelectorAll("#steps button").forEach((b) => {
    b.onclick = () => go(b.dataset.step);
  });
}

function leads() {
  return {
    import: "本步骤用于导入评论原始表。请上传 CSV 或 Excel 文件，将表格列对应到工作台字段后写入源数据。全部数据仅保存在本浏览器，不会上传至网络。",
    source: "本页展示已写入的全部源数据及其构成，便于核对导入是否正确。此处所列评论尚未抽样，不能直接编码。日期范围与抽取数量请在「抽样」中设置。",
    sample: "本步骤从源数据中抽取待编码样本。可先限定评论发布日期，再按分组与分层（如热门、最新）各抽取固定条数。仅抽出的样本进入编码台。在源数据与随机种子均不变时，重复抽取将得到同一批样本。",
    codebook: "本步骤用于制定编码规则：定义主题类别、「无法编码」的判定说明，以及供本机关键词匹配使用的词典词。词典初标仅依据关键词匹配，并非大模型自动标注。规则确定后请冻结编码表，以保证后续标注口径一致。",
    coding: "本页对抽出的样本逐条编码。请先用上方状态筛选评论，再从左侧列表选择一条。编码时先判断该条是否可编码；若可编码，再选择主题与整句情绪后保存。经词典初标的条目须经人工复核。",
    report: "本页预览编码报告：一节一图，图下是按分组写出的读法。比例只用可编码评论。导出时请在打印对话框中选择「另存为 PDF」。",
  };
}

function stratumText(s) {
  const m = {
    hot: "热门", newest: "最新", new: "最新", "热门": "热门", "最新": "最新",
    "": "未分层", "未分层": "未分层", "(未分层)": "未分层",
  };
  const k = String(s || "").trim();
  return m[k] != null ? m[k] : (k || "未分层");
}

function acceptedFiles(list) {
  const all = [...(list || [])];
  const files = all.filter((f) => /\.(csv|xlsx|xlsm|txt)$/i.test(f.name || ""));
  return { files, rejected: all.length - files.length };
}

function nextThemeId(themes) {
  const used = new Set((themes || []).map((t) => t.id));
  for (let i = 1; i < 200; i++) {
    if (!used.has("T" + i)) return "T" + i;
  }
  return "T" + ((themes || []).length + 1);
}

async function render() {
  unbindCodingKeys();
  await refresh();
  renderNav();
  const [id, lab] = STEPS.find((s) => s[0] === state.step) || STEPS[0];
  document.getElementById("pageTitle").textContent = lab;
  const lead = leads()[id] || "";
  const leadEl = document.getElementById("pageLead");
  leadEl.textContent = lead;
  leadEl.hidden = !lead;
  const view = document.getElementById("view");
  document.body.classList.toggle("rpt-mode", id === "report");
  const fn = { import: viewImport, source: viewSource, sample: viewSample, codebook: viewCodebook, coding: viewCoding, report: viewReport }[id];
  await fn(view);
}

document.getElementById("studyName").addEventListener("input", (e) => {
  e.target.dataset.dirty = "1";
});
document.getElementById("studyName").addEventListener("change", async (e) => {
  const v = e.target.value.trim().slice(0, 80);
  e.target.value = v;
  await persistMeta({ study_name: v, step: state.step });
  delete e.target.dataset.dirty;
});

function optList(headers, selected) {
  return `<option value="">不使用</option>` + headers.map((h) =>
    `<option value="${esc(h)}" ${h === selected ? "selected" : ""}>${esc(h)}</option>`
  ).join("");
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function table(rows, cols) {
  if (!rows.length) return "<p class='hint'>当前没有可显示的行。</p>";
  const head = cols.map((c) => `<th>${esc(c[1] || c[0])}</th>`).join("");
  const body = rows.map((r) => "<tr>" + cols.map(([k]) => {
    let v = r[k] ?? "";
    if (k === "stratum") v = stratumText(v);
    return `<td class="clip">${esc(String(v).slice(0, 180))}</td>`;
  }).join("") + "</tr>").join("");
  return `<div style="overflow:auto"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function countLine(obj) {
  const items = Object.entries(obj || {});
  if (!items.length) return "无";
  return items.map(([k, v]) => `${k ? stratumText(k) : "未分层"} ${v} 条`).join("、");
}

let lastUpload = null;

async function persistMapping() {
  if (!lastUpload || lastUpload.from_source || !lastUpload.files?.length) return;
  try {
    await api("/api/import/session", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mapping, study_name: document.getElementById("studyName").value.trim() }),
    });
  } catch (_) {}
}

async function viewImport(el) {
  let sess = null;
  try {
    sess = await api("/api/import/session");
  } catch (_) {}
  if (sess && (sess.files || []).length) {
    lastUpload = sess;
    mapping = { ...(sess.mapping || {}), ...mapping };
    lastUpload.mapping = mapping;
  }
  const hasDraft = lastUpload && (lastUpload.files || []).length;
  const sourceN = sess?.source_n || state.source_n || 0;
  el.innerHTML = `
    ${sourceN ? `<div class="status">源数据已保存 ${sourceN} 条。离开本页后数据仍会保留。如需更正，可调整列对应关系后重新写入，或更换表格后覆盖。</div>` : ""}
    <div class="card drop" id="drop">
      <p>${hasDraft && !sess?.from_source ? "继续拖入或选择文件，将追加到已添加的表格" : "将表格拖放到此处"}，或
        <label class="btn" style="display:inline;color:#3B6D8C;cursor:pointer">选择文件（可多选）
          <input id="files" type="file" accept=".csv,.xlsx,.xlsm,.txt" multiple hidden/>
        </label>
      </p>
      <p class="hint">支持 CSV、Excel（.xlsx / .xlsm）及 UTF-8 文本。Excel 若有多张工作表，将读取数据最多的一张。可一次选择多个文件，也可分次追加。写入源数据时，相同评论编号将去重。${hasDraft && !sess?.from_source ? "仅在选择「更换全部文件」时，才会清除已添加的表格。" : ""}</p>
      ${hasDraft && !sess?.from_source ? `<p class="row" style="margin-top:12px;justify-content:center"><button type="button" class="btn ghost" id="replaceAll">更换全部文件</button></p>` : ""}
      ${sourceN || hasDraft ? `<p class="row" style="margin-top:12px;justify-content:center"><button type="button" class="btn ghost" id="wipe">清空本机数据</button></p>` : ""}
    </div>
    <div id="mapBox"></div>`;
  const input = document.getElementById("files");
  const drop = document.getElementById("drop");
  let replaceOnce = false;
  const send = async (fileList, forceReplace) => {
    const { files, rejected } = acceptedFiles(fileList);
    if (!files.length) {
      toast(rejected ? "请选择 CSV 或 Excel 文件。" : "请先选择文件。");
      return;
    }
    const fd = new FormData();
    files.forEach((f) => fd.append("files", f));
    const append = !forceReplace && hasDraft && !sess?.from_source;
    try {
      lastUpload = await api("/api/import/upload" + (append ? "?append=1" : ""), { method: "POST", body: fd });
      mapping = lastUpload.mapping || {};
      const extra = rejected ? `；已忽略 ${rejected} 个不支持的文件` : "";
      toast(append ? `已追加，当前共 ${lastUpload.files.length} 个文件${extra}` : `已读取 ${lastUpload.files.length} 个文件${extra}`);
      go("import");
    } catch (e) { toast(e.message); }
  };
  input.onchange = () => {
    const replace = replaceOnce;
    replaceOnce = false;
    send(input.files, replace);
    input.value = "";
  };
  let dragDepth = 0;
  drop.ondragenter = (e) => { e.preventDefault(); dragDepth += 1; drop.classList.add("over"); };
  drop.ondragleave = () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.classList.remove("over"); };
  drop.ondragover = (e) => { e.preventDefault(); };
  drop.ondrop = (e) => {
    e.preventDefault();
    dragDepth = 0;
    drop.classList.remove("over");
    send(e.dataTransfer.files, false);
  };
  const replaceAll = document.getElementById("replaceAll");
  if (replaceAll) {
    replaceAll.onclick = () => {
      replaceOnce = true;
      input.click();
    };
  }
  const wipe = document.getElementById("wipe");
  if (wipe) {
    wipe.onclick = async () => {
      if (!confirm("将删除源数据、样本与全部标注。编码表草稿会保留。确定清空本机数据？")) return;
      try {
        await api("/api/reset", { method: "POST" });
        lastUpload = null;
        mapping = {};
        const name = document.getElementById("studyName");
        name.value = "";
        delete name.dataset.dirty;
        toast("已清空本机数据");
        go("import");
      } catch (e) { toast(e.message); }
    };
  }

  function drawMap() {
    const box = document.getElementById("mapBox");
    if (!lastUpload || !(lastUpload.files || []).length) {
      box.innerHTML = "";
      return;
    }
    const files = lastUpload.files.map((f) => `${esc(f.name)}（${f.rows} 行）`).join("、");
    const canCommit = !lastUpload.from_source && lastUpload.files_ready !== false;
    const previewCols = (lastUpload.headers || []).length
      ? lastUpload.headers.slice(0, 8).map((h) => [h, h])
      : [["comment_text", "评论正文"], ["group", "分组"], ["comment_date", "日期"], ["source_title", "来源"]];
    box.innerHTML = `
      <div class="card">
        <p>已读取：${files}</p>
        ${lastUpload.from_source ? `<p class="hint">下表为已写入源数据的预览。如需更改列对应关系，请重新上传原始表格。</p>` : `<p class="hint">请将表格列对应到工作台字段。「评论正文」为必填项；未对应的列不会写入源数据。</p>`}
        <div class="map" id="map"></div>
        <p class="row" style="margin-top:12px">
          <button type="button" class="btn" id="commit" ${canCommit ? "" : "disabled"}>${sourceN ? "按当前对应关系重新写入" : "整理并写入源数据"}</button>
        </p>
      </div>
      <div class="card"><h3 style="margin:0 0 8px">前若干行预览</h3>
        ${table(lastUpload.preview || [], previewCols)}
      </div>`;
    const map = document.getElementById("map");
    const headers = lastUpload.headers || [];
    if (headers.length) {
      map.innerHTML = FIELDS.map(([k, lab]) => `
        <label>${esc(lab)}</label>
        <select data-k="${k}">${optList(headers, mapping[k] || "")}</select>`).join("");
      map.querySelectorAll("select").forEach((s) => {
        s.onchange = () => {
          mapping[s.dataset.k] = s.value;
          lastUpload.mapping = mapping;
          persistMapping();
        };
      });
    } else {
      const pairs = Object.entries(mapping || {}).filter(([, v]) => v);
      map.innerHTML = pairs.length
        ? pairs.map(([k, v]) => {
            const lab = (FIELDS.find((f) => f[0] === k) || [k, k])[1];
            return `<label>${esc(lab)}</label><div>${esc(v)}</div>`;
          }).join("")
        : `<p class="hint">没有列对应记录。</p>`;
    }
    const btn = document.getElementById("commit");
    if (btn && canCommit) {
      btn.onclick = async () => {
        if (!mapping.comment_text) {
          toast("请先指定「评论正文」对应的表格列。");
          return;
        }
        try {
          const name = document.getElementById("studyName").value.trim() || "未命名研究";
          const r = await api("/api/import/commit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mapping, study_name: name }),
          });
          lastUpload.committed = true;
          lastUpload.source_n = r.n;
          toast(`已写入 ${r.n} 条评论`);
          go("source");
        } catch (e) { toast(e.message); }
      };
    }
  }
  drawMap();
}

async function viewSource(el) {
  if (!state.has_source) {
    el.innerHTML = `<div class="card">尚无源数据。请先在「导入」中上传表格并写入源数据。</div>`;
    return;
  }
  el.innerHTML = `
    <div class="kpi" id="skpi"></div>
    <p class="hint" style="margin:-6px 0 14px" id="snote"></p>
    <div id="ssecs"></div>
    <div class="card">
      <div class="row">
        <input id="q" placeholder="按正文、分组或来源标题检索" style="flex:1" aria-label="检索源数据"/>
        <button type="button" class="btn ghost" id="qgo">查找</button>
        <button type="button" class="btn" id="tosample">下一步：抽样</button>
      </div>
      <div id="stbl"></div>
      <div class="pager" id="spager"></div>
    </div>`;
  const charts = await api("/api/source/charts");
  const st = charts.stats || {};
  const dateSpan = (st.date_min && st.date_max)
    ? (st.date_min === st.date_max ? st.date_min : `${st.date_min} ～ ${st.date_max}`)
    : "无日期";
  const gnames = st.group_names || [];
  const gnote = gnames.length
    ? `当前分组：${gnames.map((g) => `<span class="tag">${esc(g)}</span>`).join("")}`

  document.getElementById("skpi").innerHTML = `
    <div class="cell"><b>${st.n ?? state.source_n}</b><span>导入评论</span></div>
    <div class="cell"><b>${st.groups ?? "—"}</b><span>分组</span></div>
    <div class="cell"><b>${st.sources ?? "—"}</b><span>来源 / 视频</span></div>
    <div class="cell"><b style="font-size:15px;line-height:1.3">${esc(dateSpan)}</b><span>评论日期</span></div>`;
  document.getElementById("snote").innerHTML =
    `${gnote} 下图用于查看源数据构成。主题与情绪结果将在完成编码后于「报告」中呈现。`;
  const sections = [
    ["mix", "评论构成"],
    ["time", "发布时间"],
    ["src", "来源分布"],
    ["like", "点赞分布"],
  ];
  const by = {};
  (charts.charts || []).forEach((c) => {
    const k = c.section || "mix";
    (by[k] || (by[k] = [])).push(c);
  });
  document.getElementById("ssecs").className = (st.layout === "single" || (st.groups || 0) <= 1) ? "src-layout single" : "src-layout multi";
  document.getElementById("ssecs").innerHTML = sections.map(([sid, lab]) => {
    const items = by[sid] || [];
    if (!items.length) return "";
    return `<section class="src-sec"><h2>${esc(lab)}</h2>
      <div class="fig-grid">${items.map(figCard).join("")}</div></section>`;
  }).join("");
  document.getElementById("tosample").onclick = () => go("sample");
  let offset = 0;
  const load = async () => {
    const q = document.getElementById("q").value.trim();
    const data = await api(`/api/source?offset=${offset}&limit=20&q=${encodeURIComponent(q)}`);
    document.getElementById("stbl").innerHTML = table(data.rows, [
      ["group", "分组"], ["stratum", "分层"], ["comment_date", "日期"],
      ["like_count", "赞"], ["source_title", "来源"], ["comment_text", "正文"],
    ]);
    document.getElementById("spager").innerHTML =
      `<button type="button" class="btn ghost" ${offset <= 0 ? "disabled" : ""} id="prev">上一页</button>
       <span>${offset + 1}–${Math.min(offset + 20, data.total)} / ${data.total}</span>
       <button type="button" class="btn ghost" ${offset + 20 >= data.total ? "disabled" : ""} id="next">下一页</button>`;
    document.getElementById("prev").onclick = () => { offset = Math.max(0, offset - 20); load(); };
    document.getElementById("next").onclick = () => { offset += 20; load(); };
  };
  document.getElementById("qgo").onclick = () => { offset = 0; load(); };
  document.getElementById("q").onkeydown = (e) => { if (e.key === "Enter") { offset = 0; load(); } };
  await load();
}

  el.innerHTML = `

async function viewCodebook(el) {
  const book = await api("/api/codebook");
  state.codebook = book;
  el.innerHTML = `
    <div class="card row">
      <span class="${book.frozen ? "frozen" : "frozen draft"}">${book.frozen ? "已冻结" : "草稿"} · 版本 ${book.version || 1}</span>

      <button type="button" class="btn" id="save" ${book.frozen ? "disabled" : ""}>保存草稿</button>
      <button type="button" class="btn warn" id="freeze">${book.frozen ? "解冻草稿" : "冻结编码表"}</button>

    </div>
    <div class="card" id="themes"></div>
    <p class="row"><button type="button" class="btn ghost" id="add" ${book.frozen ? "disabled" : ""}>添加主题</button>
      <button type="button" class="btn" id="tocode">前往编码台</button></p>`;

  const renderThemes = () => {
    const box = document.getElementById("themes");
    box.innerHTML = (book.themes || []).map((t, i) => `
      <div class="theme-ed" data-i="${i}">
        <div class="grid3">
          <label>编号<input data-f="id" value="${esc(t.id)}" ${book.frozen ? "disabled" : ""}/></label>

        </div>
        <label>词典词（以逗号分隔，供本机关键词初标）<input data-f="keywords" value="${esc(t.keywords || "")}" ${book.frozen ? "disabled" : ""}/></label>
        ${book.frozen || (book.themes || []).length <= 1 ? "" : `<p class="row" style="margin-top:8px"><button type="button" class="btn ghost" data-del>删除此主题</button></p>`}
      </div>`).join("") || "<p class='hint'>尚未添加主题。请添加主题，或载入评论模板。</p>";
    box.querySelectorAll("[data-i]").forEach((row) => {
      row.querySelectorAll("input").forEach((inp) => {
        inp.oninput = () => { book.themes[Number(row.dataset.i)][inp.dataset.f] = inp.value; };
      });
      const del = row.querySelector("[data-del]");
      if (del) {
        del.onclick = () => {
          if ((book.themes || []).length <= 1) {
            toast("至少保留一个主题。");
            return;
          }
          const t = book.themes[Number(row.dataset.i)];
          if (!confirm(`确定删除主题「${t.label || t.id}」？已使用该主题的标注将在保存后无法对齐。`)) return;
          book.themes.splice(Number(row.dataset.i), 1);
          renderThemes();
        };
      }
    });
  };
  renderThemes();
  const collect = () => {
    book.uncodable_guide = document.getElementById("guide").value;
    book.max_themes = Number(document.getElementById("maxT").value) || 3;
    book.name = document.getElementById("studyName").value || book.name;
    return book;
  };
  document.getElementById("add").onclick = () => {
    book.themes = book.themes || [];
    book.themes.push({ id: nextThemeId(book.themes), label: "新主题", hint: "", keywords: "" });
    renderThemes();
  };
  document.getElementById("save").onclick = async () => {
    try {
      state.codebook = await api("/api/codebook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: collect() }),
      });
      toast("草稿已保存");
      render();
    } catch (e) { toast(e.message); }
  };
  document.getElementById("tpl").onclick = async () => {
    if (!confirm("将以默认的 10 个主题模板覆盖当前草稿。确定载入？")) return;
    await api("/api/codebook/template", { method: "POST" });
    render();
  };
  document.getElementById("empty").onclick = async () => {
    if (!confirm("将清除现有主题，只保留一个空白主题。确定从空白开始？")) return;
    await api("/api/codebook/empty", { method: "POST" });
    render();
  };
  document.getElementById("freeze").onclick = async () => {
    try {
      if (book.frozen) {
        if (!confirm("解冻后可修改主题。若增删主题或更改编号，已有标注可能无法对齐。确定解冻？")) return;
        await api("/api/codebook/unfreeze", { method: "POST" });
      } else {
        if (!confirm("冻结后不能增删主题，也不能更改主题编号与名称。编码口径将由此固定。确定冻结？")) return;
        await api("/api/codebook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data: collect() }),
        });
        await api("/api/codebook/freeze", { method: "POST" });
      }
      render();
    } catch (e) { toast(e.message); }
  };
  document.getElementById("tocode").onclick = () => go("coding");
}

function unbindCodingKeys() {
  if (codingKeyHandler) {
    document.removeEventListener("keydown", codingKeyHandler);
    codingKeyHandler = null;
  }
}

function bindCodingKeys() {
  unbindCodingKeys();
  codingKeyHandler = (e) => {
    if (!document.getElementById("form") && !document.querySelector(".filter-bar")) {
      unbindCodingKeys();
      return;
    }
    const tag = (e.target && e.target.tagName) || "";
    const typing = tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT";
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      document.getElementById("save")?.click();
      return;
    }
    if (typing) return;
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      document.getElementById("prev")?.click();
    }
    if (e.key === "ArrowRight") {
      e.preventDefault();
      document.getElementById("nextItem")?.click();
    }
  };
  document.addEventListener("keydown", codingKeyHandler);
}

function statusTag(id, label) {
  return `<span class="st st-${esc(id)}">${esc(label)}</span>`;
}

async function loadItem(el, index) {
  const rail = document.getElementById("deskRail");
  if (!rail) {
    await viewCoding(el);
    return;
  }
  const list = await api(`/api/coding/list?filter=${encodeURIComponent(codingFilter)}`);
  let want = Number(index) || 0;
  if (list.items.length && !list.items.some((x) => x.index === want)) {
    want = list.items[0].index;
  }
  const data = list.items.length
    ? await api(`/api/coding/item?index=${want}&filter=all`)
    : await api(`/api/coding/item?index=0&filter=${encodeURIComponent(codingFilter)}`);
  currentItem = data;
  codingIndex = data.empty ? 0 : (data.index || 0);
  const counts = data.counts || {};
  const book = data.codebook || {};
  const pct = data.total ? Math.round(100 * data.coded_n / data.total) : 0;
  const pos = list.items.findIndex((x) => x.index === codingIndex);
  const prevIndex = pos > 0 ? list.items[pos - 1].index : null;
  const nextIndex = pos >= 0 && pos < list.items.length - 1 ? list.items[pos + 1].index : null;

  const progress = document.getElementById("deskProgress");
  if (progress) {
    progress.setAttribute("aria-valuenow", String(pct));
    progress.innerHTML = `<i style="width:${pct}%"></i>`;
  }
  document.getElementById("deskFilters").innerHTML = CODING_FILTERS.map(([id, lab]) => {
    const n = counts[id] != null ? counts[id] : "";
    return `<button type="button" class="chip ${codingFilter === id ? "on" : ""}" data-filter="${id}" aria-pressed="${codingFilter === id ? "true" : "false"}">${lab} ${n}</button>`;
  }).join("");

  const filtLab = (CODING_FILTERS.find((x) => x[0] === codingFilter) || [codingFilter, codingFilter])[1];
  rail.innerHTML = `
    <div class="rail-head">
      <div>
        <strong>${esc(list.title || filtLab)}</strong>
        <span class="hint">${list.total} 条</span>
      </div>
    </div>
    <div class="clist" id="clist">
      ${list.items.length ? list.items.map((it) => `
        <button type="button" class="clist-item ${it.index === codingIndex ? "on" : ""}" data-list-index="${it.index}">
          <div class="clist-top">
            ${statusTag(it.status, it.status_label)}
            ${it.emotion_label ? `<span class="st st-emo">${esc(it.emotion_label)}</span>` : ""}
            <span class="clist-meta">${esc(it.group)} · ${esc(stratumText(it.stratum))}</span>
          </div>
          <div class="clist-text">${esc(it.text.slice(0, 90))}${it.text.length > 90 ? "…" : ""}</div>
          ${it.theme_labels && it.theme_labels.length ? `<div class="clist-themes">${it.theme_labels.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        </button>`).join("") : `<p class="hint">当前筛选条件下没有评论。请改选上方状态。</p>`}
    </div>`;
  const onItem = rail.querySelector(".clist-item.on");
  if (onItem) onItem.scrollIntoView({ block: "nearest" });

  const quote = document.getElementById("deskQuote");
  const form = document.getElementById("form");
  if (!list.items.length || data.empty || !data.row) {
    quote.innerHTML = `<p class="hint">尚未选中评论。</p>`;
    form.innerHTML = `<p class="hint">请从左侧列表选择一条评论，开始编码。</p>`;
    return;
  }

  const row = data.row;
  const c = data.coding || { uncodable: false, themes: [], overall_emotion: "", memo: "" };
  const selected = new Map((c.themes || []).map((t) => [t.id, t.emotion]));
  const itemStatus = list.items.find((x) => x.index === codingIndex);
  quote.innerHTML = `
    <p class="meta">
      ${itemStatus ? statusTag(itemStatus.status, itemStatus.status_label) : ""}
      ${esc(row.group || "未分组")} · ${esc(stratumText(row.stratum))} · ${esc(row.comment_date || "无日期")} · 赞 ${esc(row.like_count)} · 回 ${esc(row.reply_count)}
      · 列表 ${pos + 1} / ${list.total}
    </p>
    <p class="meta">${esc(row.source_title || row.source_id || "")}
      · ${book.frozen ? "编码表已冻结" : "编码表为草稿"}</p>
    <div class="quote">${esc(row.comment_text)}</div>`;

  form.innerHTML = `
    <p><label><input type="checkbox" id="unc" ${c.uncodable ? "checked" : ""}/> 无法编码</label></p>
    <p class="hint">${esc(book.uncodable_guide || "若评论无法判断其所讨论的内容，请勾选此项后保存。")}</p>
    <div id="able">
      <p>主题（最多 ${book.max_themes || 3} 个。点击主题名称以选中或取消；选中后须为其指定情绪）</p>
      <div id="themes"></div>
      <p style="margin-top:10px">整句情绪（必填；指整条评论的总体态度，而非各主题情绪的合计）</p>
      <div id="emo"></div>
    </div>
    <p>备注（可选）</p>
    <textarea id="memo">${esc(c.memo || "")}</textarea>
    <p class="row" style="margin-top:12px">
      <button type="button" class="btn ghost" id="prev" ${prevIndex == null ? "disabled" : ""}>上一条</button>
      <button type="button" class="btn ghost" id="nextItem" ${nextIndex == null ? "disabled" : ""}>下一条</button>
      <button type="button" class="btn ghost" id="skip">跳过</button>
      <button type="button" class="btn" id="save">保存并下一条</button>
    </p>`;

  const themesEl = document.getElementById("themes");
  const maxT = Number(book.max_themes || 3);
  themesEl.innerHTML = (book.themes || []).map((t) => {
    const on = selected.has(t.id);
    const emo = selected.get(t.id);
    return `<div class="chip ${on ? "on" : ""}" data-id="${esc(t.id)}" title="${esc(t.hint || t.label)}">
      <span>${esc(t.label)}</span>
      <span class="theme-emo">${EMO.map(([k, lab]) =>
        `<button type="button" data-e="${k}" class="${on && emo === k ? "on" : ""}">${lab[0]}</button>`
      ).join("")}</span>
    </div><div class="hint theme-hint">${esc(t.hint || "")}</div>`;
  }).join("");

  const emoEl = document.getElementById("emo");
  emoEl.innerHTML = EMO.map(([k, lab]) =>
    `<span class="chip ${c.overall_emotion === k ? "on" : ""}" data-emo="${k}">${lab}</span>`
  ).join("");
  emoEl.querySelectorAll(".chip").forEach((ch) => {
    ch.onclick = () => {
      emoEl.querySelectorAll(".chip").forEach((x) => x.classList.remove("on"));
      ch.classList.add("on");
    };
  });

  const setThemeChip = (ch, on, emotion) => {
    ch.classList.toggle("on", on);
    ch.querySelectorAll("button").forEach((b) => {
      b.classList.toggle("on", !!(on && emotion && b.dataset.e === emotion));
    });
  };
  themesEl.querySelectorAll(".chip").forEach((ch) => {
    ch.addEventListener("click", (e) => {
      const emoBtn = e.target.closest ? e.target.closest(".theme-emo button") : null;
      if (emoBtn) {
        if (!ch.classList.contains("on") && themesEl.querySelectorAll(".chip.on").length >= maxT) {
          toast(`每条评论最多选择 ${maxT} 个主题。`);
          return;
        }
        setThemeChip(ch, true, emoBtn.dataset.e);
        return;
      }
      if (ch.classList.contains("on")) {
        setThemeChip(ch, false);
        return;
      }
      if (themesEl.querySelectorAll(".chip.on").length >= maxT) {
        toast(`每条评论最多选择 ${maxT} 个主题。`);
        return;
      }
      setThemeChip(ch, true);
    });
  });

  const able = document.getElementById("able");
  const unc = document.getElementById("unc");
  const syncUnc = () => {
    able.style.opacity = unc.checked ? .35 : 1;
    able.style.pointerEvents = unc.checked ? "none" : "auto";
  };
  unc.onchange = syncUnc;
  syncUnc();

  document.getElementById("prev").onclick = () => {
    if (prevIndex == null) return;
    loadItem(el, prevIndex);
  };
  document.getElementById("nextItem").onclick = () => {
    if (nextIndex == null) return;
    loadItem(el, nextIndex);
  };
  const goAfter = async () => {
    await refresh();
    if (nextIndex == null) toast("已保存。当前筛选列表已到最后一条。");
    await loadItem(el, nextIndex != null ? nextIndex : codingIndex);
  };
  document.getElementById("save").onclick = async () => {
    const themes = [];
    let missingThemeEmo = false;
    themesEl.querySelectorAll(".chip.on").forEach((ch) => {
      const emoBtn = ch.querySelector("button.on");
      if (!emoBtn) { missingThemeEmo = true; return; }
      themes.push({ id: ch.dataset.id, emotion: emoBtn.dataset.e });
    });
    const overall = emoEl.querySelector(".chip.on")?.dataset.emo || "";
    if (!unc.checked && !themes.length && !missingThemeEmo) {
      toast("请至少选择一个主题，或勾选「无法编码」。");
      return;
    }
    if (!unc.checked && missingThemeEmo) {
      toast("已选主题须指定情绪（正 / 中 / 负 / 混）。");
      return;
    }
    if (!unc.checked && !overall) {
      toast("请选择整句情绪后再保存。");
      return;
    }
    try {
      await api("/api/coding/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          comment_id: row.comment_id,
          uncodable: unc.checked,
          themes,
          overall_emotion: overall,
          memo: document.getElementById("memo").value,
        }),
      });
      await goAfter();
    } catch (e) { toast(e.message); }
  };
  document.getElementById("skip").onclick = async () => {
    try {
      await api("/api/coding/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          comment_id: row.comment_id,
          skip: true,
          memo: document.getElementById("memo").value,
        }),
      });
      await goAfter();
    } catch (e) { toast(e.message); }
  };
}

function bindCodingChrome(el) {
  if (el.dataset.deskBound === "1") return;
  el.dataset.deskBound = "1";
  const runAuto = async (overwrite) => {
    try {
      const r = await api("/api/coding/auto", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ overwrite_auto: overwrite }),
      });
      toast(`词典初标完成：写入 ${r.n} 条，已有记录跳过 ${r.skipped} 条，未命中 ${r.no_hit} 条，其中判定无法编码 ${r.uncodable_n} 条`);
      await refresh();
      await loadItem(el, codingIndex);
    } catch (e) { toast(e.message); }
  };
  el.addEventListener("click", (e) => {
    if (!document.getElementById("deskRail")) return;
    const filterBtn = e.target.closest && e.target.closest(".filter-bar [data-filter]");
    if (filterBtn) {
      codingFilter = filterBtn.dataset.filter;
      loadItem(el, 0);
      return;
    }
    const listBtn = e.target.closest && e.target.closest("[data-list-index]");
    if (listBtn) {
      loadItem(el, Number(listBtn.dataset.listIndex));
      return;
    }
    if (e.target.id === "autoFill" || (e.target.closest && e.target.closest("#autoFill"))) {
      if (!confirm("将对尚未保存过的样本做本机关键词初标。已标注、已跳过及经人工保存的条目不会被改写。确定开始？")) return;
      runAuto(false);
      return;
    }
    if (e.target.id === "autoOver" || (e.target.closest && e.target.closest("#autoOver"))) {
      if (!confirm("将重新生成所有「词典初标」记录。经人工保存的条目不会被改写。确定覆盖？")) return;
      runAuto(true);
      return;
    }
    if (e.target.id === "clearCoding" || (e.target.closest && e.target.closest("#clearCoding"))) {
      (async () => {
        if (!confirm("将删除全部已标注、无法编码、已跳过与词典初标记录。样本与编码表予以保留。确定清空？")) return;
        try {
          const r = await api("/api/coding/clear", { method: "POST" });
          toast(`已清空 ${r.cleared} 条标注`);
          await refresh();
          await loadItem(el, codingIndex);
        } catch (err) { toast(err.message); }
      })();
    }
  });
}

function openReportPrint(html) {
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const w = window.open(url, "_blank");
  if (!w) {
    URL.revokeObjectURL(url);
    toast("请允许弹出窗口，以便导出 PDF。");
    return;
  }
  const go = () => {
    try { w.focus(); w.print(); } catch (_) {}
  };
  w.onload = go;
  setTimeout(go, 700);
  toast("请在打印对话框中选择「另存为 PDF」。");
}

function printReportFrame(iframe) {
  const doc = iframe && iframe.contentDocument;
  const win = iframe && iframe.contentWindow;
  if (!doc || !win || !doc.body || !doc.body.childElementCount) return false;
  try {
    win.focus();
    win.print();
    toast("请在打印对话框中选择「另存为 PDF」。");
    return true;
  } catch (_) {
    return false;
  }
}

async function viewReport(el) {
  if (!state.has_sample) {
    el.innerHTML = `<div class="card">请先完成抽样，并在编码台完成若干条标注后，再查看报告。</div>`;
    return;
  }
  el.innerHTML = `
    <div class="rpt-bar">
      <button type="button" class="btn" id="dl" disabled>生成并下载 PDF 报告</button>
      <span class="hint">将打开系统打印对话框。请选择「另存为 PDF」或「Microsoft Print to PDF」。报告在本机生成，数据不会上传。</span>
    </div>
    <iframe class="rpt-frame" id="rptFrame" title="编码报告预览"></iframe>`;
  const iframe = document.getElementById("rptFrame");
  const dl = document.getElementById("dl");
  try {
    const html = await api("/api/report.html");
    dl.disabled = true;
    const enable = () => { dl.disabled = false; };
    iframe.onload = enable;
    setTimeout(enable, 1600);
    iframe.srcdoc = html;
    dl.onclick = () => {
      if (printReportFrame(iframe)) return;
      openReportPrint(html);
    };
  } catch (e) {
    iframe.replaceWith(Object.assign(document.createElement("div"), {
      className: "card",
      textContent: e.message,
    }));
    dl.onclick = () => toast(e.message);
  }
}

function bindChartTip() {
  if (bindChartTip.done) return;
  bindChartTip.done = true;
  let tip = document.getElementById("chartTip");
  if (!tip) {
    tip = document.createElement("div");
    tip.id = "chartTip";
    document.body.appendChild(tip);
  }
  const findTip = (el) => {
    while (el && el.nodeType === 1) {
      if (el.getAttribute && el.getAttribute("data-tip")) return el;
      el = el.parentElement || el.parentNode;
    }
    return null;
  };
  const hide = () => { tip.style.display = "none"; };
  document.addEventListener("pointermove", (e) => {
    const node = findTip(e.target);
    if (!node) { hide(); return; }
    tip.textContent = node.getAttribute("data-tip") || "";
    tip.style.display = "block";
    let x = e.clientX + 12;
    let y = e.clientY + 16;
    const tw = tip.offsetWidth;
    const th = tip.offsetHeight;
    if (x + tw > window.innerWidth - 8) x = e.clientX - tw - 12;
    if (y + th > window.innerHeight - 8) y = e.clientY - th - 10;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  });
  document.addEventListener("scroll", hide, true);
}

bindChartTip();
render().catch((e) => toast(e.message));

  </script>
